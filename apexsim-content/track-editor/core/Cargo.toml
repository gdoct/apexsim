[package]
name = "track-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rmp-serde = "1"
thiserror = "2"
flate2 = "1"
# The formats the server reads too (the track YAML, the sidecars, content_crc).
apexsim-formats = { path = "../../../apexsim-lib/formats" }

[dev-dependencies]
tempfile = "3"
