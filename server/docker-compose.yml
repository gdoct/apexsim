services:
  # One-shot: fills the content volume from the content image, then exits.
  # Publish/update content separately:  docker build -f server/Dockerfile.content -t apexsim-content .
  content:
    image: apexsim-content            # or registry/apexsim-content:tag
    build:
      context: ..
      dockerfile: server/Dockerfile.content
    restart: "no"
    volumes:
      - apexsim-content:/content

  apexsim:
    image: apexsim-server             # or registry/apexsim-server:tag
    build: .
    restart: unless-stopped
    depends_on:
      content:
        condition: service_completed_successfully
    ports:
      - "9000:9000/tcp"
      - "9001:9001/udp"
      - "9002:9002/tcp"
    environment:
      # server.docker.toml has TLS off and auth "dev" (accept anyone): fine on a
      # LAN, not on the internet.  For TLS, mount certs and set:
      #   APEXSIM_NETWORK_TLS_CERT_PATH=/certs/server.crt
      #   APEXSIM_NETWORK_TLS_KEY_PATH=/certs/server.key
      #   APEXSIM_NETWORK_REQUIRE_TLS=true
      APEXSIM_LOGGING_LEVEL: info
    volumes:
      - apexsim-content:/content:ro
      - apexsim-data:/data            # lap records, ghosts, replays

volumes:
  apexsim-content:
  apexsim-data:
