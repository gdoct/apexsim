  - id: r4-spa-snow
    about: "R4. Snow at Spa, changeable, into the evening; glass cracks on a hypercar"
    # No AC-imported circuit is installed, so the imported props wait. A
    # closed car for the glass: DamagePreview dents the player's car on the
    # client alone (front, then rear). The clock runs 30x from 15:00, and the
    # forecast may stop the snow: the line freezes once it has.
    args:
      - -ApexAutoRace
      - -ApexTrack=Spa
      - -ApexCar=Chiffon
      - -ApexAiCount=7
      - -ApexLaps=12
      - -ApexCountdown=5
      - -ApexWeather=snow
      - -ApexChangeable=1
      - -ApexTimeScale=30
      - -ApexTimeOfDay=15:00
      - -ApexView=chase
      - -ApexRacingLine=off
    server:
      stand_in: true
    shots:
      - at: 15
        label: "broadleaf tree close (tree cards, SnowFloor 0.4)"
        checks: "Snow on tree cards close up"
        exec: "apexsim.cam.LookAt 416.8 -139.3 -11.4 361.1 -171.7 -8.0"
      - at: 20
        label: "conifer close"
        checks: "Snow on tree cards close up"
        exec: "apexsim.cam.LookAt -136.6 326.6 6.9 -97.9 381.9 5.0"
      - at: 25
        label: "armco barrier close"
        checks: "Faces-up snow on barriers"
        exec: "apexsim.cam.LookAt -113.5 316.8 5.1 -90.7 338.7 3.5"
      - at: 30
        label: "grandstand roof"
        checks: "Faces-up snow on roofs"
        exec: "apexsim.cam.LookAt 115.2 167.8 -5.7 160.5 171.6 -2.0"
      - at: 35
        label: "media centre roof and walls"
        checks: "Faces-up snow on roofs and walls"
        exec: "apexsim.cam.LookAt 253.7 16.7 -15.0 270.8 -24.9 -18.0"
      - at: 60
        label: "chase near: front hit (preview 60%)"
        checks: "Glass cracks round a front hit; on the windscreen?"
        exec: ["apexsim.cam.Release", "apexsim.car.DamagePreview 60,0,0,0,0", "apexsim.cam.Chase near"]
      - at: 63
