  # Diagnostic: which compound a stock setup starts on in heavy rain, by the
  # HUD's own data points in the client log (no stand-in, then with one).
  - id: diag-wet-compound
    about: "diagnostic: the starting compound in heavy rain"
    args:
      - -ApexAutoRace
      - -ApexTrack=Spa
      - -ApexCar=SF-26
      - -ApexAiCount=3
      - -ApexLaps=3
      - -ApexCountdown=5
      - -ApexWeather=heavyrain
      - -ApexView=chase
    exec:
      60: ["apexsim.hud.Data tyre", "apexsim.hud.Data item.compound", "apexsim.cam.Chase close"]
      90: ["apexsim.hud.Data tyre"]
    shots:
      - at: 65
        label: "chase close at green"
        checks: "compound band and tread on a stock setup in heavy rain"
      - at: 95
        label: "chase close, later"
        checks: "same"
