[/Script/Engine.RendererSettings]
r.DefaultFeature.AntiAliasing=2
r.Mobile.ShadingPath=0
; Distance fields feed software Lumen; without them the scene has no GI, no
; distance-field AO and no distance-field shadows, which is most of why every
; surface used to render as one flat ambient term.
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
; Lets the sky atmosphere color the per-track height fog.
r.SupportSkyAtmosphereAffectsHeightFog=True
; Physical exposure units (EV100). The race director drives the sun at real
; sunlight intensity and the track post-process volumes clamp exposure in
; EV100; on the legacy range those clamps are meaningless and the scene blows
; out to white.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=1
; Daylight sits around EV100 13-15 with the race sun; the default cached
; lighting pre-exposure clips (safe range caps at EV 12) and Lumen warns.
r.EyeAdaptation.CachedLightingPreExposure=11

