; The in-editor Model Context Protocol server does not auto-start by default,
; and its setting lives in per-project user settings — which are not checked in.
; Declaring it here means anyone who opens this project gets the MCP endpoint on
; http://127.0.0.1:8000/mcp without hunting through Editor Preferences.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8000
bAutoStartServer=True
bEnableToolSearch=True

; Autosave off. Asset authoring here happens in long scripted batches, and an
; autosave firing partway through one both fights the batch for the game thread
; and leaves a recovery prompt that blocks the editor on next launch.
[/Script/UnrealEd.EditorLoadingSavingSettings]
bAutoSaveEnable=False
