[/Script/UnrealEd.ProjectPackagingSettings]
; Nothing hard-references most of this project's content: the race director
; builds the track level path at runtime from the track the server names, and
; the menu loads the catalog data tables (and through them every preview and
; car mesh) by path. DirectoriesToAlwaysCook is not enough — the cooker scans
; those folders for *.uasset only (CookOnTheFlyServer.cpp, "Loading directory
; to always cook"), so every L_<Track>.umap was left out and packaged builds
; raced in an empty world. bCookAll is the one option that also picks up maps.
bCookAll=True
+DirectoriesToAlwaysCook=(Path="/Game/Tracks")
+DirectoriesToAlwaysCook=(Path="/Game/Data")
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
UsePakFile=True

