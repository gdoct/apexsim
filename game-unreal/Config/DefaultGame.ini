[/Script/UnrealEd.ProjectPackagingSettings]
; Nothing hard-references most of this project's content: the menu loads the
; catalog data tables (and through them every preview and car mesh) by path,
; and the tracks are not content at all. Every circuit is built at runtime
; from its export in Game/Tracks (UApexTrackContentSubsystem), which finds
; everything it is dressed with by path: the parent materials
; (ApexMaterialBake), the prop kit, the ground sets. bCookAll carries it all;
; the always-cook list says which folders matter, in case it ever goes.
bCookAll=True
+DirectoriesToAlwaysCook=(Path="/Game/Data")
+DirectoriesToAlwaysCook=(Path="/Game/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Props")
+DirectoriesToAlwaysCook=(Path="/Game/Ground")
+DirectoriesToAlwaysCook=(Path="/Game/Cars/Wheels")
; The cockpit rig (steering wheel, mirror bezels) is built from the engine's
; basic shapes at runtime; they are referenced from a C++ constructor, which
; the cooker only follows for content it already knows about.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
; Levels imported with ApexTrackImport are for looking at a circuit in the
; editor only; the game never loads them, so they never ship.
+DirectoriesToNeverCook=(Path="/Game/Tracks")
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
FullRebuild=False
ForDistribution=False
UsePakFile=True

