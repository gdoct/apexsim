  # R13 with tonight's pieces (2026-10-20): a car's engine killed on the
  # road at 20 s of green brings out a yellow (the marshal light panels
  # flash in its sector), then the safety car (drawn, roof lamps), the
  # stand-in queueing behind it; the cockpit dash flags SC. The lobby's
  # race rules show in the session browser (r9 runs), not here.
  - id: r13b-safety-car
    about: "R13. The safety car drawn, the dash's SC, the light panels lit"
    args:
      - -ApexAutoRace
      - -ApexTrack=Monzarella
      - -ApexCar=Caravan
      - -ApexAiCount=7
      - -ApexLaps=5
      - -ApexCountdown=5
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexView=chase
      - -ApexRacingLine=off
      - -ApexSafetyCar=on
    server:
      stand_in: true
      events:
        - "20:4:damage=engine:100"
    exec:
      30: ["apexsim.hud.Data flag.", "apexsim.hud.Data race."]
      60: ["apexsim.hud.Data race."]
      90: ["apexsim.hud.Data race."]
    shots:
      - {at: 28, label: "the yellow out: a light panel ahead?", checks: "F2 panels flash yellow in the incident's sector"}
      - {at: 31, label: "", checks: "F2 panels"}
      - {at: 45, label: "safety car called", checks: "R6 the safety car drawn, lamps"}
      - {at: 60, label: "the queue behind the safety car", checks: "R6 the safety car leading the queue"}
      - {at: 75, label: "", checks: "R6 the safety car"}
      - {at: 90, label: "cockpit: the dash", checks: "R6 the dash shows SC", exec: "apexsim.cam.Chase cockpit"}
      - {at: 105, label: "TV", checks: "R6 the safety car from the TV camera", exec: "apexsim.tv.Shot trackside"}
      - {at: 120, label: "", checks: "R6 the safety car in this lap: lamps out"}

  # N25 (2026-10-20): the rain radar over the minimap. Heavy rain in the
  # forecast 3 min into the session: a band of cells upwind, drifting in,
  # reaching the circuit as the rain starts (the map zooms out to take it
  # in); then the rain over the circuit.
  - id: n25-rain-radar
    about: "N25. The rain radar on the minimap"
    args:
      - -ApexAutoRace
      - -ApexTrack=SpaFrankenchamps
      - -ApexCar=Caravan
      - -ApexAiCount=5
      - -ApexLaps=8
      - -ApexCountdown=5
      - -ApexWeather=overcast
      - -ApexForecast=5:heavyrain
      - -ApexTimeOfDay=14:00
      - -ApexView=chase
      - -ApexRacingLine=off
    server:
      stand_in: true
    exec:
      30: ["apexsim.hud.Data sky."]
      240: ["apexsim.hud.Data sky."]
    shots:
      - {at: 30, label: "rain 4:30 away: the band far upwind", checks: "N25 the band upwind, the map zoomed out"}
      - {at: 150, label: "2:30 away", checks: "N25 the band drifting in"}
      - {at: 270, label: "0:30 away", checks: "N25 the band at the circuit's edge"}
      - {at: 340, label: "raining", checks: "N25 the rain over the circuit"}

  # What R13 had left (2026-10-20): the race_phase banner on a formation lap
