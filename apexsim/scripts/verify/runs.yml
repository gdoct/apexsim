  # An allowance of two laps against a slow AI field (level 70) (four would
  # run the stand-in dry: qualifying fuels three laps, HOTLAP_FUEL_LAPS). Every AI
  # goes out as the session starts and the session ends once the last car's
  # laps are used, so the player has to be back first: the stand-in goes out
  # at once and gains on the field over two timed laps, and is in the
  # garage (LAP ALLOWANCE USED, GO OUT disabled) while the slowest AI still
  # laps. With one or two laps each the field was done within seconds of it.
  - id: r12-allowance-used
    about: "R12. The lap allowance used: USED on the race state, GO OUT disabled"
    server:
      stand_in: true
    args:
      - -ApexAutoRace
      - -ApexTrack=Snorisring
      - -ApexCar=Caravan
      - -ApexAiCount=5
      - -ApexAiSkill=70
      - -ApexMode=6
      - -ApexLapAllowance=2
      - -ApexQualifyingMinutes=10
      - -ApexCountdown=5
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexHotlapOutAfter=8
    exec:
      150: ["apexsim.hud.Data qualifying."]
      300: ["apexsim.hud.Data qualifying."]
      330: ["apexsim.hud.Data qualifying.", "apexsim.ui.Texts"]
      350: ["apexsim.hud.Data qualifying.", "apexsim.ui.Texts"]
    shots:
      - {at: 150, label: "a timed lap", checks: "laps left"}
      - {at: 300, label: "the last lap", checks: "USED on the race state"}
      - {at: 320, label: "", checks: "USED on the race state"}
      - {at: 335, label: "in the garage", checks: "LAP ALLOWANCE USED, GO OUT disabled"}
      - {at: 345, label: "in the garage", checks: "LAP ALLOWANCE USED, GO OUT disabled"}
      - {at: 355, label: "in the garage", checks: "LAP ALLOWANCE USED, GO OUT disabled"}
      - {at: 370, label: "", checks: ""}

