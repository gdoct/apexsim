  # A pit plan set in the pause menu (which pauses the session: the start
  # comes after it), then the connection dropped on the grid
  # (apexsim.net.Drop): the client reconnects, rejoins its held seat and
  # sends the plan again ("Rejoined ...: sending the pit plan again" in
  # client.log); BOX this lap then stops on that plan (fuel alone).
  - id: r11-rejoin-plan
    about: "R11. The pit plan sent again after a rejoin, and a stop on it"
    server:
      stand_in: true
      # The stand-in is an AI and does not read BOX: send it in, after the
      # rejoin (events count from the green, which the pause holds back).
      events:
        - "40:host:pit"
    args:
      - -ApexAutoRace
      - -ApexTrack=Snorisring
      - -ApexCar=Caravan
      - -ApexAiCount=3
      - -ApexLaps=6
      - -ApexCountdown=5
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexView=chase
      - -ApexOpenPause=12
    exec:
      14: ["apexsim.ui.Texts PIT", "apexsim.ui.Click PIT PLAN"]
      16: ["apexsim.ui.Key Gamepad_FaceButton_Bottom"]
      16.6: ["apexsim.ui.Key Gamepad_DPad_Down"]
      17.2: ["apexsim.ui.Key Gamepad_DPad_Right"]
      17.8: ["apexsim.ui.Key Gamepad_FaceButton_Bottom"]
      18.4: ["apexsim.ui.Key Gamepad_FaceButton_Bottom"]
      19: ["apexsim.ui.Texts"]
      24: ["apexsim.ui.Key Gamepad_FaceButton_Right"]
      28: ["apexsim.ui.Key Gamepad_FaceButton_Right"]
      36: ["apexsim.net.Drop"]
      50: ["apexsim.hud.Data pit."]
      52: ["apexsim.ui.Key P"]
      54: ["apexsim.hud.Data pit."]
      128: ["apexsim.hud.Data pit."]
      134: ["apexsim.hud.Data pit."]
    shots:
      - {at: 22, label: "PIT PLAN: tyres KEEP, fuel +5 L", checks: "the plan before the drop"}
      - {at: 38, label: "just dropped", checks: "the reconnect"}
      - {at: 46, label: "rejoined", checks: "back in the race on the held seat"}
      - {at: 56, label: "BOX after the rejoin", checks: "BOX badge"}
      - {at: 100, label: "", checks: "BOX until the stop"}
      - {at: 125, label: "", checks: "the stop on the plan"}
      - {at: 130, label: "", checks: "the stop on the plan: fuel alone"}
      - {at: 135, label: "", checks: "the stop on the plan: fuel alone"}
      - {at: 140, label: "", checks: "the stop on the plan: fuel alone"}
      - {at: 150, label: "", checks: ""}
      - {at: 170, label: "after the stop", checks: "BOX off"}

  # A race weekend of one three-minute knockout round under the 107% rule,
  # the player's car (the stand-in) on two flat tyres from 5 s: it sets no
  # time inside the cut while the AI do, so it does not qualify. The host's
  # timesheet starts the race: the grid card, then the race with the
  # non-qualifier parked in its box: DNQ in the standings, the tower and the
  # results. (With no time set by anyone nobody is out: a one-minute round
