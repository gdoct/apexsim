  - id: n15-profiles
    about: "N15. Driver profiles: the Profile screen, a second driver"
    # The profile screen over the menu; a second driver made and then left
    # for the first again. It writes ApexProfiles.sav and a second profile's
    # slots: back up Saved/SaveGames first. Run n15-who-drives after it.
    args:
      - -ApexNoDemo
      - -ApexStartScreen=11
    exec:
      3: ["apexsim.profile.Picture 3"]
      8: ["apexsim.profile.New Ana 9"]
      13: ["apexsim.profile.List", "apexsim.profile.Use 1"]
    shots:
      - at: 6
        label: "Profile screen: the first driver with picture 3"
        checks: "N15: the profile screen (list, picture, name, stats, PBs)"
      - at: 11
        label: "Ana made and driving"
        checks: "N15: a new driver in the list, picture 9, no stats"
      - at: 16
        label: "Back on the first driver"
        checks: "N15: switching back keeps each driver's own picture and stats"

  - id: n15-who-drives
    about: "N15. Driver profiles: the launch asks who drives"
    # Nothing but the runner's own switches, so with two profiles (after
    # n15-profiles) the launch opens on "Who is driving?".
    shots:
      - at: 8
        label: "Who is driving?"
        checks: "N15: the launch picker with two drivers"

  - id: n7-season
    about: "N7. Offline season: setup, standings, a round raced and filed"
    # A three-round season of two-lap races against five AI, round 1 at
    # Zandervoort, the stand-in driving the player's car. Writes the
    # profile's season: back up Saved/SaveGames first.
    server:
      stand_in: true
    args:
      - -ApexNoDemo
      - -ApexStartScreen=12
    exec:
      3: ["apexsim.season.Setup 2 5 3 Zandervoort"]
      8: ["apexsim.season.Race"]
      12: ["apexsim.season.Race"]
      # The round opens on the race's grid, which waits for Ready.
      40: ["apexsim.ui.Click Ready"]
      330: ["apexsim.ui.Texts"]
    shots:
      - at: 6
        label: "Season setup: steppers and the calendar"
        checks: "N7: the setup card"
      - at: 10
        label: "Season started: calendar, empty standings"
        checks: "N7: the season card before a round"
      - at: 30
        label: "Round 1's grid: five AI and the player"
        checks: "N7: the round is a race with the season's field"
      - at: 120
        label: "Round 1 under way"
        checks: "N7: the race"
      - at: 320
        label: "After the flag"
        checks: "N7: results, the round filed (client log: round 1 of 3 filed)"

  - id: n7-season-standings
    about: "N7. Offline season: the standings after round 1"
    # Right after n7-season, on the profile it wrote.
    args:
      - -ApexNoDemo
      - -ApexStartScreen=12
    shots:
      - at: 6
        label: "Season after round 1: calendar with the winner, standings"
        checks: "N7: the drivers' and cars' standings"

  # A two-class race (-ApexClasses): four LMP2s and three GT3s with the
  # player's Caravan, the stand-in driving. The lobby lists the grid by
  # class (the LMP2s first), the standings tag each car with its class
  # place, and the results screen's car column leads with it.
  - id: n5-multi-class
    about: "N5. A two-class race: the grid by class, class places in the standings and the results"
    server:
      stand_in: true
    args:
      - -ApexAutoRace
      - -ApexNoStart
      - -ApexTrack=Snorisring
      - -ApexCar=Caravan
      - -ApexClasses=LMP2:4,GT3:3
      - -ApexLaps=1
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexView=chase
    exec:
      15: ["apexsim.ui.Texts"]
      20: ["apexsim.ui.Click Start countdown"]
      30: ["apexsim.grid.Ready"]
      60: ["apexsim.hud.Data race."]
      110: ["apexsim.hud.Data item."]
      145: ["apexsim.ui.Texts"]
    shots:
      - {at: 17, label: "the lobby: GRID list", checks: "the LMP2s on the first four slots, the GT3s behind"}
      - {at: 36, label: "the grid card", checks: "the field by class"}
      - {at: 62, label: "the race: standings", checks: "each row's class and class place (LMP2 P1.., GT3 P1..)"}
      - {at: 95, label: "the race: standings, later", checks: "the class places follow the overall order"}
      - {at: 115, label: "the finish view", checks: "the standings' class places at the flag"}
      - {at: 148, label: "the finish overlay", checks: "each row's class place beside the name (GT3 P1...)"}

  # A missed downshift to 1st at 100 km/h (the gear event, held for 3 s by
  # the stand-in) in the rally car, which has no downshift protection, on
  # the Norisring: the shift warning banner and the rev counter
  # flash red with the revs past the limit, the gear digit goes red, and
  # the cockpit dash's light bar flashes red; the damage panel's engine zone
  # takes it.
  - id: b16-over-rev
    about: "B16. The over-rev cues: banner, rev counter, gear digit, dash light bar"
    server:
      stand_in: true
      events:
        - "22:host:gear=1:3"
        - "40:host:gear=1:3"
    args:
      - -ApexAutoRace
      - -ApexTrack=Snorisring
      - -ApexCar=037
      - -ApexAiCount=0
      - -ApexLaps=3
      - -ApexCountdown=5
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexView=chase
    # The over-rev lasts only as long as the car takes to slow to the
    # gear's limiter, a few tenths: the shots sit right on the event (22 s
    # of green is 27.4 s on the clock here).
    exec:
      27.45: ["apexsim.hud.Data car."]
      27.6: ["apexsim.hud.Data car."]
      38: ["apexsim.cam.Chase cockpit"]
    shots:
      - {at: 27.5, label: "the over-rev from the chase camera", checks: "OVER-REV banner, flashing rev counter, red gear"}
      - {at: 27.65, label: "a moment later", checks: "the banner's percent past the limit"}
      - {at: 27.8, label: "and later", checks: "the banner, or the rev counter back on the limiter"}
      - {at: 45.5, label: "the over-rev from the cockpit", checks: "the dash's light bar flashing red"}
      - {at: 45.65, label: "the cockpit again", checks: "the other phase of the flash"}
      - {at: 45.8, label: "the cockpit, later", checks: "the gear digit red: 1st would over-rev"}

  # A downshift to 1st asked of a GT3 at speed, whose box refuses it: the
  # amber DOWNSHIFT REFUSED banner, the red gear digit (a downshift would
  # over-rev) and the dash's amber blink.
  - id: b16-refused
    about: "B16. A refused downshift's cues on a protected box"
    server:
      stand_in: true
      events:
        - "22:host:gear=1:3"
    args:
      - -ApexAutoRace
      - -ApexTrack=Snorisring
      - -ApexCar=Caravan
      - -ApexAiCount=0
      - -ApexLaps=2
      - -ApexCountdown=5
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexView=cockpit
    exec:
      27.5: ["apexsim.hud.Data car."]
      28.5: ["apexsim.hud.Data car."]
    shots:
      - {at: 27.6, label: "the refused downshift", checks: "DOWNSHIFT REFUSED banner, red gear digit, the dash blinking amber"}
      - {at: 28, label: "a moment later", checks: "the other phase of the blink"}
      - {at: 28.6, label: "still refused", checks: "the banner stays while the paddle is held"}

