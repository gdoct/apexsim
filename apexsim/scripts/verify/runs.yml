  # A one-lap race under a one-stop rule: nobody stops (the stand-in and the
  # AI plan no stop this short), so the field takes the flag owing it. PEN
  # in the HUD's standings once classified, then the session's results
  # screen (apexsim.finish end).
  - id: r11-pen-standings
    about: "R11. PEN in the HUD's standings and on the session results screen"
    server:
      stand_in: true
    args:
      - -ApexAutoRace
      - -ApexTrack=Snorisring
      - -ApexCar=Caravan
      - -ApexAiCount=5
      - -ApexLaps=1
      - -ApexCountdown=5
      - -ApexMandatoryStops=1
      - -ApexWeather=sunny
      - -ApexTimeOfDay=13:00
      - -ApexView=chase
    exec:
      95: ["apexsim.hud.Data item."]
      105: ["apexsim.hud.Data item."]
      120: ["apexsim.finish end"]
      125: ["apexsim.ui.Texts"]
    shots:
