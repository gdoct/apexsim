  # Diagnostic: why the TV's helicopter shot looks cheap (follow-ups, "Top
  # view"). One held shot, one change per frame: depth of field (f/11 on a
  # long lens reads as a miniature), the cars' LOD, and the sun's height.
  - id: diag-topview
    about: "diagnostic: the helicopter shot, A/B depth of field, LOD, sun"
    args:
      - -ApexAutoRace
      - -ApexTrack=Nuerburgerring
      - -ApexCar=SF-26
      - -ApexAiCount=7
      - -ApexLaps=3
      - -ApexCountdown=20
      - -ApexTimeOfDay=13:00
      - -ApexView=tv
      - -ApexRacingLine=off
    exec:
      3: ["apexsim.tv.Shot helicopter"]
    shots:
      - at: 10
        label: "A: helicopter as it is (f/11 depth of field)"
        checks: "baseline"
      - at: 12
        label: "B: depth of field off"
        checks: "does the miniature look go?"
        exec: "apexsim.tv.DepthOfField 0"
        lead: 1
      - at: 14
        label: "C: depth of field off, cars forced to LOD 0"
        checks: "car detail at distance"
        exec: "r.ForceLOD 0"
        lead: 1
      - at: 16
        label: "D: back to as it is"
        checks: "baseline again (the orbit moved two seconds)"
        exec: ["apexsim.tv.DepthOfField 1", "r.ForceLOD -1"]
        lead: 1

