      262: ["apexsim.ui.Click Start the race"]
      275: ["apexsim.ui.Texts"]
      282: ["apexsim.grid.Ready"]
      285: ["apexsim.ui.Texts"]
      310: ["apexsim.hud.Data item."]
      400: ["apexsim.hud.Data item."]
      460: ["apexsim.finish view", "apexsim.ui.Texts"]
    shots:
      - {at: 60, label: "Q1, flat tyres", checks: ""}
