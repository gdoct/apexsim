  # The menu's demo backdrop from a cold start: a GPU hang (VSM non-Nanite
  # culling, CullPerPageDrawCommandsCs) came 5 s after Silverstone's track
  # was built behind the menu. Short runs, so a soak is many cold starts:
  #   run_checks.py "b1-*" --repeat 20 --game-arg=-gpucrashdebugging
  # Shot times count from the menu's start here (no race view). The showcase
  # is named by id: the game renders it into Saved/ApexSim/Showcases first
  # when it has none, so the first run on a machine starts later.
  - id: b1-backdrop-silverstone
    about: "B1. Demo backdrop cold start: Silverstone F1 (the hang of 2026-10-17)"
    args:
      - "-ApexShowcase=Shiverstone.f1.day"
    shots:
      - {at: 15, label: "backdrop just built", checks: "GPU soak: no hang"}
      - {at: 30, label: "backdrop", checks: "GPU soak: no hang"}
      - {at: 45, label: "backdrop", checks: "GPU soak: no hang"}

