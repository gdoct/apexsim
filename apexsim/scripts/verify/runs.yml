# The unattended screen runs of docs/verification.md, section 1.
# Run with scripts/verify/run_checks.py; the format is in its docstring.
#
# A run:
#   id, about           names it; `about` names its section in verification.md
#   resolution          WIDTHxHEIGHT (default 1920x1080)
#   server.stand_in     an AI drives the player's car
#   server.events       debug events, "<s of green>:<host|all|car>:<action>"
#                       (docs/server/operations.md, Debug hooks)
#   server.env          any other APEXSIM_* override
#   args                the game's switches (docs/game/client.md)
#   exec                {seconds: command or [commands]} with no shot of their own
#   shots               at (s from the game's start), label, checks (the
#                       verification.md item it is for), exec (commands run
#                       `lead` s, default 3, before the grab)
#
# Shot times count from the race view's clock, which starts with the session
# (the engine's own start-up comes before it); events count from the green,
# which comes -ApexCountdown seconds (and about one more) after that. So a
# shot at T sees green + T - countdown - 1.
#
# The stand-in is an AI and stops for what an AI stops for (sim/src/pit.rs
# plan_stop): any leak or puncture, a flat spot of 0.6, wear of 70%, 25% in a
# damage zone. A stop fits new tyres and repairs: keep under those, or grab
# within the lap of the event.
#
# Camera poses: python scripts/verify/spots.py <Track> --puddles N | --grade N
# | --bank N | --at M | --near X,Y (server frame, the YAML's).

runs:
  - id: r1-spa-wet
    about: "R1. Spa, heavy rain, stand-in driver"
    # An F1 car's rear treads are hidden from the chase camera; the cockpit
    # sees the front tyres' tops.
    server:
      stand_in: true
      events:
        - "10:host:flatspot=FL:0.3"
        - "40:host:flatspot=FL:0.7"
        - "60:host:leak=FR:0.3"
        - "250:host:puncture=RL"
    args:
      - -ApexAutoRace
      - -ApexTrack=SpaFrankenchamps
      - -ApexCar=SF-26
      - -ApexAiCount=9
      - -ApexLaps=10
      - -ApexCountdown=5
      - -ApexWeather=heavyrain
      - -ApexTimeOfDay=14:00
      - -ApexView=chase
      - -ApexRacingLine=off
    shots:
      - at: 150
        label: "cockpit: FL tread, two flat spots?"
        checks: "Tyres: two lock-ups on one tyre (FlatSpot2); real wet tyre"
        exec: "apexsim.cam.Chase cockpit"
      - at: 152
        label: "cockpit again (another turn of the wheel)"
        checks: "FlatSpot2"
      - at: 154.5
        label: "cockpit, third"
        checks: "FlatSpot2; LEAK read-out (leak FR from 60 s)"
      - at: 165
        label: "chase near: rain light, spray"
        checks: "Rain light; spray from the chase camera"
        exec: "apexsim.cam.Chase near"
      - at: 175
        label: "Eau Rouge low cell 1035 m, at road height"
        checks: "Puddle across part of the road"
        exec: "apexsim.cam.LookAt 303.3 -29.3 -24.6 303.6 -37.3 -25.4"
      - at: 180
        label: "Eau Rouge low cell 1035 m, from the other side"
        checks: "Puddle across part of the road"
        exec: "apexsim.cam.LookAt 305.1 -47.1 -24.2 303.6 -37.3 -25.4"
      - at: 185
        label: "Eau Rouge low cell 1035 m, from above"
        checks: "Puddle across part of the road"
        exec: "apexsim.cam.LookAt 289.0 -9.7 -20.4 303.6 -37.3 -25.4"
      - at: 190
        label: "Raidillon 1185 m (12.9% grade)"
        checks: "Geometry pass: Spa's elevation"
        exec: "apexsim.cam.LookAt 389.6 -101.1 -11.2 414.3 -133.7 -14.2"
      - at: 205
        label: "TV camera"
        checks: "Spray from the TV camera; rain light"
        exec: ["apexsim.cam.Release", "apexsim.tv.View 1"]
        lead: 6
      - at: 215
        label: "TV camera, later"
        checks: "Spray from the TV camera"
      - at: 228
        label: "TV camera, later"
        checks: "Spray from the TV camera"
      - at: 310
        label: "chase near, HUD"
        checks: "FLAT read-out (puncture RL at 250 s of green); LEAK"
        exec: ["apexsim.tv.View 0", "apexsim.cam.Chase near"]
        lead: 5
      - at: 316
        label: "cockpit, HUD"
        checks: "FLAT and LEAK read-outs; FlatSpot2 still there"
        exec: "apexsim.cam.Chase cockpit"

  - id: r2-silverstone-stint
    about: "R2. Silverstone, cloudy, green start, long stint"
    # The same corner cameras at the green and ten minutes on: rubber 0 to
    # marbles. Rear damage 40 is past half the rear wing's detach_pct (45):
    # the wing hangs and the DRS flap is dented, still on the car.
    server:
      stand_in: true
      events:
        - "30:host:flatspot=FL:0.6"
        - "60:host:damage=rear:40"
        - "200:host:wear=70"
        - "520:host:leak=RR:2"
    args:
      - -ApexAutoRace
      - -ApexTrack=Shiverstone
      - -ApexCar=SF-26
      - -ApexAiCount=11
      - -ApexLaps=30
      - -ApexCountdown=5
      - -ApexWeather=cloudy
      - -ApexTimeOfDay=13:00
      - -ApexTrackRubber=0
      - -ApexView=chase
      - -ApexRacingLine=off
    shots:
      - at: 38
        label: "corner 1045 m on the grid: a green road"
        checks: "A green start (rubber 0)"
        exec: "apexsim.cam.LookAt 741.1 347.8 12.6 752.7 357.5 10.1"
      - at: 42
        label: "corner 5515 m on the grid"
        checks: "A green start"
        exec: "apexsim.cam.LookAt 106.5 -197.6 4.0 94.2 -206.0 1.5"
      - at: 46
        label: "the sky: cloudy (0.5 cover)"
        checks: "Cloud dome, scattered cloud"
        exec: "apexsim.cam.LookAt 169.8 249.4 5.3 400 400 300"
      - at: 130
        label: "chase near: rear wing hanging, DRS flap dented"
        checks: "Dented DRS flap; a part hanging (UpdateHangingParts)"
        exec: ["apexsim.cam.Release", "apexsim.cam.Chase near"]
      - at: 134
        label: "chase close: rear wing and flap"
        checks: "Dented DRS flap; hanging droop and flutter"
        exec: "apexsim.cam.Chase close"
      - at: 140
        label: "cockpit: FL flat-spotted slick, front camber"
        checks: "Flat-spotted slick; static camber"
        exec: "apexsim.cam.Chase cockpit"
      - at: 480
        label: "cockpit after a long stint: tread pickup, blisters, heat"
        checks: "Pickup, blisters, heat tint on the tread"
      - at: 486
        label: "chase close after a long stint"
        checks: "Pickup, blisters, heat tint; camber"
        exec: "apexsim.cam.Chase close"
      - at: 600
        label: "chase close: RR deflated (leak from 520 s)"
        checks: "Sidewall bulge of a deflated tyre; LEAK read-out"
      - at: 606
        label: "chase near: the bulge"
        checks: "Sidewall bulge"
        exec: "apexsim.cam.Chase near"
      - at: 615
        label: "corner 1045 m after ten minutes"
        checks: "Marbles off the line; rubbered line"
        exec: "apexsim.cam.LookAt 741.1 347.8 12.6 752.7 357.5 10.1"
      - at: 620
        label: "corner 5515 m after ten minutes"
        checks: "Marbles off the line"
        exec: "apexsim.cam.LookAt 106.5 -197.6 4.0 94.2 -206.0 1.5"

