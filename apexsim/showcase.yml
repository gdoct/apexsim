# Showcases: rendered AI races the menu plays behind its screens and the
# server plays to clients (docs/game/spectator.md). Rendered into build/showcase/
# as <track>.<class>.<variant>.apxs by scripts/build_track_levels.ps1 (and
# initialize_content.ps1); only what is missing or stale is rendered, where
# stale means `apexsim-replay info --check` says the track YAML or a car.toml
# changed since the render. The same entry and seed write a byte-identical
# file, so a rebake after a content change is reproducible.
#
# Read by scripts/lib/ApexShowcase.ps1 with a hand-rolled parser (PowerShell
# has no YAML reader), so keep to this exact shape: top-level maps of
# `key: value` and `key: { k: v, ... }`, a `showcases` list of one-line flow
# maps, lists as `[a, b]`, strings quoted only when they hold a colon.
#
#   defaults   cars (grid size), laps (from green), seed; `seeds: N` renders
#              N seeds from `seed` up and keeps the best; `ai_level: 95` races
#              the field at that AI level (70-110, spread over 4 points round
#              it) instead of the mixed field, novice to ace
#   variants   a short name for a sky: weather (sunny | cloudy | overcast |
#              lightrain | heavyrain) and time (hh:mm), optionally air (°C),
#              wind (km/h) and wind_from (degrees from the start straight)
#   showcases  track (the YAML stem under content/tracks), class (as the
#              car.toml spells it: GT3, LMP2, F1, Hypercar), variants (one
#              file each); cars, laps, seed, seeds and ai_level override
#              the defaults. `info --check` does not see an ai_level change:
#              render that showcase again with -Force
#
# An imported track (scripts/ac_import.py) is never rendered by the pipeline.
defaults:
  cars: 20
  laps: 2
  seed: 7
variants:
  day:   { weather: sunny, time: "13:00" }
  dusk:  { weather: cloudy, time: "19:30" }
  rain:  { weather: lightrain, time: "15:00" }
  night: { weather: sunny, time: "22:30" }
showcases:
  - { track: Armadillos, class: F1, variants: [day] }
  - { track: BrandsScratch, class: GT3, variants: [day] }
  - { track: Hungoverring, class: F1, variants: [day] }
  - { track: Barcelunatic, class: LMP2, variants: [day] }
  - { track: Hockeyheimring, class: GT3, variants: [day] }
  - { track: Endianapolis, class: Hypercar, variants: [day] }
  - { track: Lemons, class: Hypercar, variants: [dusk] }
  - { track: AlbertParkour, class: Hypercar, variants: [day] }
  - { track: HermanosRodriQueso, class: F1, variants: [day] }
  - { track: ChillyVilleneuve, class: LMP2, variants: [day] }
  - { track: Monzarella, class: F1, variants: [day] }
  - { track: MoscowMule, class: LMP2, variants: [day] }
  - { track: Mordschleife, class: GT3, variants: [day] }
  - { track: Snorisring, class: GT3, variants: [day] }
  - { track: Nuerburgerring, class: GT3, variants: [rain] }
  - { track: Oskarsleben, class: GT3, variants: [day] }
  - { track: Bahrainless, class: F1, variants: [night] }
  - { track: Interlaggos, class: F1, variants: [rain] }
  - { track: Shebang, class: Hypercar, variants: [rain] }
  - { track: Shanghaied, class: LMP2, variants: [day] }
  - { track: Shiverstone, class: F1, variants: [day] }
  - { track: Gnocchi, class: LMP2, variants: [day] }
  - { track: SpaFrankenchamps, class: LMP2, variants: [dusk] }
  - { track: RedPullRing, class: GT3, variants: [day] }
  - { track: Sudoku, class: F1, variants: [day] }
  - { track: YasMarinara, class: Hypercar, variants: [dusk] }
  - { track: Zandervoort, class: GT3, variants: [day] }
