- id: v-r4-wind-veer
  title: The wind turning with a front
  area: sky-weather
  kind: screen
  check_by: r4-spa-snow
  created: 2026-10-16
  commit: 34c49433
  what: >-
    The wind turning with a front (`LiveConditions::veer_target_deg`): the snow's
    drift and the cloud swinging round over a few minutes after a change of
    weather, the HUD's wind arrow with it.
  status: confirmed
  evidence: [{run: r4-spa-snow, date: 2026-10-25, kind: shot}]
  notes:
  - text: >-
      R4 (Snow at Spa, changeable, into the evening): `-ApexWeather=snow -ApexChangeable=1
      -ApexTimeScale=30` from 15:00. No AC-imported circuit is installed; Spa
      stands in.
  - date: 2026-10-25
    text: >-
      Run 2026-10-24 (`r4-spa-snow`, after A5's winter-tyre AI): the snow on
      the ground, the falling snow, the stands and the evening light render;
      the props' faces-up snow is not readable at these poses. The player's
      stand-in Chiffon stood at 0 km/h in first gear from about 300 s to the
      end (560 s), its flat spots at 76%, more than 300 s behind: a car stuck
      in the snow, as this bullet's field check fears. Its client and server
      logs are in `out/verify/r4-spa-snow/`: find where it stopped and why before
      closing the snow rows. Not reproduced off-screen (2026-10-25): `snow_stall_survey`
      with the run's live sky (`SURVEY_TIME_OF_DAY=15:00 SURVEY_TIME_SCALE=30
      SURVEY_CHANGEABLE=1 SNOW_SECONDS=560`), seeds 1-6 on the centerline and
      1-3 on the road mesh, stalled no Chiffon longer than a few seconds. What
      the survey does not have is the stand-in in the player's car (its setup
      and tyres as the player's); run `r4-spa-snow` again and watch the stand-in
      from 250 s. Found the same night: run again, the stand-in hit the wall
      at La Source in the first minute and sat against it to the end. Racecraft
      (the back-out, the put-back after `RESET_AFTER_S`) decided only for cars
      with an AI profile, never for a human's car the stand-in drives; it does
      now (`racecraft_test::a_stand_in_that_cannot_get_back_on_the_road_is_put_back`).
      Run again with it: the stand-in raced on (38-80 km/h through La Source
      and Eau Rouge in the evening shots, P5-6), took hits (31% front, 43% rear,
      a flat) and retired at about 575 s, its finish view following; the sky
      went from snow to overcast with the forecast. Its finish view listed every
      car nameless and none as the player's (titled CHEQUERED FLAG): the recorder
      took names only from a roster that came after a car's first frame. It
      names a car from the roster as it first sees it now (`UApexSessionRecorder::FindOrAddCar`).
      Run again 2026-10-25: the stand-in retired at about 560 s (engine OUT,
      its water at 123-139 °C after hits that left 35% front damage) and its
      finish view read YOUR RACE IS OVER with every driver named and Player
      (YOU) marked; the field had run one lap of the snow in nine minutes. The
      snow rows above (ice, melt, the veer, the props' snow) are still to judge.
  review:
    at: 2026-10-25T14:00:18
    score: 3
    processed: true

