# The verification backlog (docs/verification.md): every built feature not yet
# seen in the game, heard, or felt on hardware, one item each. The schema and
# the workflow are in docs/verifier.md; `python scripts/verify/verifier.py
# check` validates it. The agent owns every key but `status` and `review`;
# the review page (`verifier.py serve`) writes those two and nothing else.

- id: v-track-suzuka-elevation
  title: Suzuka's real elevation
  area: track
  kind: screen
  check_by: sudoku-elevation
  created: 2026-10-18
  what: >-
    Suzuka's real elevation (`dem_elevation.py`, the crossover held at 7 m):
    the bridge deck and the road under it from the road and from above, Degner-to-hairpin's
    new grades, and the stands and barriers re-seated on it (`spots.py Sudoku`).
  status: judged
  evidence:
  - run: sudoku-elevation
    date: 2026-10-28
    commit: 67e3f7d1
    shots: [1, 2, 3, 4, 5, 6]
    kind: shot
  - run: sudoku-elevation
    date: 2026-11-08
    commit: 894171e3
    shots: [1, 2, 3, 4, 5, 6]
    kind: shot
  verdict:
    date: 2026-11-08
    by: agent
    says: looks-right
    text: >-
      After the owner's review (see-through bridge walls, shot 3): the deck's
      parapets, slab and fascias were swept profiles open at both ends, so from
      the approach one looked into the parapets and out through their far faces.
      ats-export now closes each end with the cross-section (deck_end_cap).
      Shot 3 of 2026-11-08 against 2026-10-28: both parapets' near ends are
      solid faces. The parapets still start on the embankment with no approach
      barrier leading into them; judge whether that reads right.
    shots: [3]
  notes:
  - date: 2026-10-28
    text: >-
      Review (not-right, score 4): the elevation is good, but you can see through
      the walls of the bridge, the sides do not propely line up. check the 3rd
      screenshot

