      R2 (Silverstone, cloudy, green start, long stint): `-ApexWeather=cloudy
      -ApexTrackRubber=0`, a long race; events: `wear=`, `flatspot=`, `leak=`,
      `damage=rear:P` short of the wing's `detach_pct`.
