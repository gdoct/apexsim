      as expected. The car in reverse at 6 km/h in the lane at 620 s was the
      route's: held on the brake the automatic box put reverse in and the route's
      creep away (under 0.3 throttle) never took first again; the route asks
      for first now (`pit::drive_input`).
  review:
    at: 2026-10-25T13:39:29
    score: 2
    comment: >-
      can''t see it in the pictures. we need more detailed pictures of the tyre
    processed: true

