      `damage=rear:P` short of the wing's `detach_pct`.
  - date: 2026-10-25
    text: >-
      Run 2026-10-25 (`r2-silverstone-stint`, the stand-in with racecraft):
      the green start read "rubber 4%" and the line rubbered to 20% in ten minutes
      (the conditions panel); the rear wing hanging and dented with 40% rear
      damage after the `damage=rear` event; the leak's stop under the pit autopilot.
