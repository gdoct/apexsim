[package]
name = "apexsim-sim"
version = "0.1.0"
edition = "2021"
description = "The deterministic simulation: car physics, tyres, AI, race control, the session tick"
publish = false

[lib]
name = "apexsim_sim"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_repr = "0.1"
rmp-serde = "1"
flate2 = "1"
thiserror = "2"
tracing = "0.1"
toml = "1.1"
# The formats the content writes and the sim reads (track YAML, sidecars, content_crc).
apexsim-formats = { path = "../../../apexsim-lib/formats" }

[dev-dependencies]
tempfile = "3"
