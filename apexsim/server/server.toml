[server]
tick_rate_hz = 420
max_sessions = 32
session_timeout_seconds = 300

[network]
tcp_bind = "0.0.0.0:9000"
udp_bind = "0.0.0.0:9001"
health_bind = "0.0.0.0:9002"
# Local development runs plaintext: leave the certificate paths empty and
# require_tls = false. For production set both paths and require_tls = true.
tls_cert_path = ""
tls_key_path = ""
require_tls = false
heartbeat_interval_ms = 1000
heartbeat_timeout_ms = 5000

[content]
# The content root (APEXSIM_CONTENT): cars and tracks are its cars/ and
# tracks/. cars_dir / tracks_dir (APEXSIM_CONTENT_CARS_DIR / _TRACKS_DIR)
# name either folder elsewhere.
root = "../../apexsim-content"

[logging]
level = "info"
console_enabled = true

[auth]
# "dev" accepts any token (development only!). For production use
# mode = "token" and list shared secrets in `tokens`.
mode = "dev"
tokens = []

[records]
# Best legal lap per driver, track and car, kept across restarts in
# `dir`/lap_records.json with each record lap's ghost trace beside it.
enabled = true
dir = "./records"
# Replays of finished sessions: an `.apxs` (the spectator stream format, which
# the game's Replays screen plays) and a `.meta.json` each.
replay_dir = "./replays"
# Each finished race's classification is written to `dir`/results/ (JSON and
# CSV) and, when webhook_url is set, POSTed there: "json" posts the result as
# written, "discord" a Discord message (a channel webhook's URL).
# webhook_url = "https://discord.com/api/webhooks/..."
# webhook_format = "discord"

[physics]
# How the sim finds the surface under a wheel (apexsim-content/docs/road-mesh.md):
#   "centerline" - the nearest centerline point's height sheared by the
#                  banking, with the curb bands for the track limits.
#   "mesh"       - a track's baked <Track>.road.msgpack when it has one (the
#                  road the client draws, as triangles: curbs with their
#                  profile, two levels at a crossover); the centerline for a
#                  track without the sidecar.
# APEXSIM_PHYSICS_ROAD_CONTACT overrides it.
road_contact = "mesh"

[showcase]
# Rendered AI races (build/showcase/*.apxs from scripts/build_track_levels.ps1,
# docs/game/spectator.md) the server streams to clients sitting in the menu, in
# place of a simulated demo race per client. Every key is optional; these
# are the defaults. A `dir` that is not there is no showcase, not an error;
# a file whose track or cars this server does not have, or whose checksums
# disagree with its content, is dropped with a log line.
# APEXSIM_SHOWCASE_ENABLED / APEXSIM_SHOWCASE_DIR override the first two.
#enabled = true
#dir = "./showcase"
# File names without .apxs, in channel order; "*" is every file not named.
# The first is what a client gets when it asks for none.
#playlist = ["*"]
# What a channel does when its file ends: "loop" plays the same file again,
# "rotate" moves on to the next of the playlist.
#mode = "loop"
# Send every Nth frame of a file (1 = all of them).
#stream_divisor = 1

[admin]
# The web dashboard (docs/server/operations.md): plain HTTP and HTTPS on their
# own ports, behind an access token. Every key is optional; these are the
# defaults. Loopback only: bind to 0.0.0.0 to reach it from other machines,
# and then prefer HTTPS (redirect_http_to_https = true).
#enabled = true
#http_bind = "127.0.0.1:9003"
#https_bind = "127.0.0.1:9004"
# Empty: network.tls_cert_path/tls_key_path when those files exist, else a
# self-signed certificate made once and kept beside the ban list.
#tls_cert_path = ""
#tls_key_path = ""
# Empty: a random token is made at every start and printed once in the log.
#token = ""
#redirect_http_to_https = false
#bans_file = "./records/bans.json"
# The cars and tracks switched off on the Content view.
#content_file = "./records/content.json"
# The Schedule view's sessions.
#schedule_file = "./records/schedule.json"
#log_buffer_lines = 5000
# What the Config view's RESTART SERVER does: "respawn" starts a copy of this
# process with the same command line and stops this one; "exit" only stops it,
# for a supervisor (Docker, systemd) that starts it again; "off" refuses.
#restart = "respawn"

# Balance of performance (docs/server/operations.md): one table a car, named by
# its car.toml name or id. A car no table names drives as loaded.
# [[balance]]
# car = "GT3 Example"
# ballast_kg = 25.0   # added at the centre of gravity
# power = 0.97        # the torque curve scaled
# downforce = 1.0     # both axles' lift coefficients
