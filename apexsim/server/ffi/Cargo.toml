[package]
name = "apexsim-physics"
version = "0.1.0"
edition = "2021"
description = "The server's car step behind a C FFI, for the client's prediction of its own car"
publish = false

# A staticlib for the client to link, and an rlib so this crate's own tests
# call the extern "C" functions from Rust.
[lib]
name = "apexsim_physics"
crate-type = ["staticlib", "rlib"]

[dependencies]
apexsim-server = { path = ".." }
rmp-serde = "1"

[dev-dependencies]
uuid = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
