tech:
  eyebrow: Architecture
  title: Three parts,<br>one truth
  intro: >-
    Simulation logic stays isolated from presentation, so each piece can
    evolve on its own. The circuit you race is the circuit the server
    simulates, checked by CRC on both sides.
  nodes:
    - key: server/ · Rust
      title: Authoritative server
      body: >-
        {{ n.tick_hz }}&nbsp;Hz tokio loop. Physics, OBB collision against
        cars and baked barriers, tyres, fuel, heat and damage, race control
        and pit stops, AI, force feedback, lap timing and records.
        <code>/health</code> <code>/metrics</code>
    - key: game-unreal/ · C++
      title: Unreal client
      body: >-
        Tracks and cars built at runtime from their files, menus as C++
        widget trees, a HUD from JSON, a cockpit built per car, dents and
        debris drawn from the server's damage figures, TV director,
        replays and track guides, synthesized audio, DirectInput wheels.
        Every car a telemetry puppet.
    - key: track-editor/ · Rust
      title: Track pipeline
      body: >-
        <code>ats-dress</code>, <code>ats-groom</code> and
        <code>ats-export</code> turn a centerline and a dossier into the
        export the game builds, and the road mesh, walls, kerbs and pit
        lane the server drives on. A Bevy editor sits on top.
  links:
    - UDP<br>{{ n.telemetry_hz }}&nbsp;Hz
    - exports<br>&amp; sidecars
  specs:
    - title: Collision that means it
      body: >-
        Every armco, tyre wall, stand and building is baked into a walls
        sidecar. Nothing off the road is decorative.
    - title: A road with height
      body: >-
        The server drives on the rendered road as triangles: kerbs you can
        feel, run-off that is tarmac, and two levels where a circuit
        crosses itself.
    - title: Track limits
      body: >-
        Four wheels past the kerb band for 0.2&nbsp;s strikes the lap. Cut
        the course and it's gone too.
    - title: Racing line
      body: >-
        A quasi-steady-state speed profile per car from its grip,
        downforce, power and brakes.
    - title: Assists, host-controlled
      body: >-
        ABS, traction control, auto gearbox, steering assist, damage level.
        The session host decides what's allowed; the server enforces it.
    - title: Cockpit
      body: >-
        Wheel, dash and scene-captured mirrors built per car. Seat, horizon
        lock and head motion are yours to set.
    - title: Records and ghosts
      body: >-
        Your best legal lap per car and circuit survives restarts, with a
        trace of the lap that set it to race against.
    - title: Checked content
      body: >-
        Each car and circuit carries a checksum of its source file. A
        client racing on different data than the server is told so.
    - title: Replays nobody drove
      body: >-
        A seeded AI race replays bit for bit. The menu's backdrop races and
        the trailer were run headless, then filmed by the game's own
        cameras.

cta:
  image: cta.webp
  eyebrow: In active development
  title: Get on the grid
  body: >-
    The simulation and the networking underneath it are solid. Presentation
    and gameplay are filling in fast. Build it, run a server, and go
    racing.
  commands: |-
    <i># once, on a fresh clone: generate the content</i>
    ./scripts/initialize_content.ps1
    <i># build, start a local server and play (Windows)</i>
    ./scripts/play_editor.ps1 -Build

