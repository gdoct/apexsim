# The marketing page's words. scripts/site/build_site.py puts them into
# site/template.html and writes docs/index.html.
#
# Every string is HTML (so `&amp;`, `&nbsp;`, <code>, <br> work) and may
# quote the game's own figures, which the build reads from content/ and the
# server source (scripts/site/facts.py), so no number is typed here:
#
#   {{ n.cars }} {{ n.tracks }} {{ n.km }} {{ n.classes }} {{ n.dossiers }}
#   {{ n.setup_knobs }} {{ n.hud_components }} {{ n.liveries }} {{ n.countries }}
#   {{ n.longest_km }} {{ n.longest_relief }} {{ n.tick_hz }} {{ n.telemetry_hz }}
#   {{ n.cars|words }}            fourteen
#   {{ name('Monza') }}           a circuit's display name, by stem
#   {{ car('posh-gt3rs') }}       a car's name, by folder
#   {{ car_class('posh-gt3rs') }} its class as the game shows it
#
# Circuits and corners appear by their display names only (CLAUDE.md, "No
# trademarks on screen"): write {{ name('Spa') }}, never the real name.
#
# `python scripts/site/build_site.py --stale` lists what changed in the
# feature docs since this copy was last reviewed against them.

site:
  url: https://gdoct.github.io/apexsim/
  repo: https://github.com/gdoct/apexsim
  trailer: yiTEfozkK00
  title: ApexSim — Racing Simulator
  description: >-
    ApexSim is a source-available racing simulator: a {{ n.tick_hz }} Hz
    authoritative Rust physics server, an Unreal Engine 5 client,
    {{ n.cars }} cars across {{ n.classes }} classes and {{ n.tracks }}
    real-world circuits, a {{ n.longest_km }} km mountain loop among them.
  og_description: >-
    {{ n.tick_hz }} Hz authoritative physics, Unreal Engine 5, {{ n.cars }}
    cars, {{ n.tracks }} real circuits, tyres, fuel, pit stops and damage
    simulated on the server.
  og_image: splash.webp

hero:
  image: splash.webp
  image_alt: Four GT cars racing into an alpine sunset under the ApexSim wordmark
  eyebrow: Source-available simracing platform
  headline: The server decides <br><em>where every car is.</em>
  lede: >-
    ApexSim runs a {{ n.tick_hz }}&nbsp;Hz authoritative physics simulation
    in Rust and renders it in Unreal&nbsp;Engine&nbsp;5.
    {{ n.cars|words|capitalize }} cars, {{ n.tracks|words }} real circuits,
    and no second physics model to argue with. Cars, circuits and the HUD
    are files you can open.
  telemetry_label: Telemetry · S2

stats:
  - {value: '{{ n.tick_hz }}', unit: Hz, label: Authoritative physics tick}
  - {value: '{{ n.cars }}', label: 'Cars · {{ n.classes|words }} classes'}
  - {value: '{{ n.tracks }}', label: Real-world circuits}
  - {value: '{{ n.km }}', unit: km, label: Of surveyed tarmac}
  - {value: '0', label: Client-side physics}

features:
  eyebrow: What's under the bodywork
  title: Built like<br>a race car
  intro: >-
    Every system that matters to how a car drives lives on the server,
    computed from the tyres outward. The client's job is to render it
    faithfully and get out of the way.
  cards:
    - tag: Physics
      wide: true
      icon: wheel
      title: A four-wheel model that earns its grip
      body: >-
        Per-wheel loads, Pacejka-style tyres, suspension and a drivetrain
        with real gear ratios, driving on the same road mesh the client
        draws: a kerb is five centimetres tall in the physics too.
        Downforce follows ride height and rake, a tow saves drag and dirty
        air takes the front wing away. Deterministic to the bit, guarded by
        a test that asserts identical runs.
      chips: [Pacejka tyres, Ride-height aero, Slipstream, Road mesh, Deterministic]
    - tag: Netcode
      wide: true
      icon: graph
      title: One simulation, clocked in server ticks
      body: >-
        TCP+TLS for the lobby, UDP for telemetry and input, bound by a
        token handshake. Cars are rendered from a telemetry buffer
        interpolated between samples and dead-reckoned across gaps, so
        motion stays smooth without a second model to reconcile.
      chips: [Protocol v2, MessagePack, 'Telemetry at {{ n.telemetry_hz }} Hz', Prometheus metrics]
    - tag: Tyres and fuel
      title: A car that changes over a stint
      body: >-
        Each tyre is a tread and a core with their own temperatures.
        Pressure follows the gas law, grip follows the working window, and
        wear ends in a cliff. Soft, medium and hard compounds. Fuel is
        burned by the power the engine makes, and its weight moves the
        balance as the tank drains.
    - tag: Heat
      title: Carbon wants heat, steel fades
      body: >-
        Each brake disc is a thermal mass, heated by what the pads absorb
        and cooled through a duct you can resize in the garage. Carbon is
        weak when cold; steel fades past 700&nbsp;°C. The radiator runs hot
        in a long tow, and an engine that overheats gives up power.
    - tag: Damage
      title: Every hit counts, and shows
      body: >-
        Contact is scored by closing speed across five zones. A bent nose
        loses downforce and radiator flow, a damaged flank pulls the
        steering, a hurt engine loses power, and a zone at 100% ends the
        race. You can see it on the car: panels dent and scuff, wings and
        noses come off, and a hurt engine trails smoke. The host picks
        full, reduced or no damage.
    - tag: Strategy
      title: Pit stops, DRS and deployment
      body: >-
        Turn into the pit lane and the server drives the car to its own
        box on the limiter, where a crew changes tyres, refuels and
        repairs; a red light holds it at the exit while traffic passes.
        The AI plans its own stops. DRS arms within a second of the car
        ahead. Hybrids have harvest, balanced and attack modes, a lap
        budget and an overtake button.
    - tag: Circuits
      title: Real ground, real furniture
      body: >-
        Measured centerlines with per-side width and banking, and terrain
        from the Copernicus GLO-30 elevation model out to an eight
        kilometre horizon. Stands, pit lanes, barriers and woodland are
        laid from OpenStreetMap dossiers on {{ n.dossiers }} of the
        {{ n.tracks }} circuits.
    - tag: Force feedback
      title: Feel the front let go
      body: >-
        Steering-column torque summed from each front tyre's aligning
        moment, scrub and jacking: the rim goes light as the grip peaks.
        Kerbs, lock-ups and the road's own texture come through it.
        DirectInput wheels, pedals and button boxes, with the steering lock
        matched to each car.
    - tag: Audio
      title: Engines that are simulated, not sampled
      body: >-
        A crank turned at live RPM fires each cylinder into exhaust banks,
        headers and a silencer. Crossplane burble, overrun pops, gear
        whine, and tyres that howl only past their grip peak. Zero audio
        files.
    - tag: Weather
      title: Rain, wind and thin air
      body: >-
        Five weather states, any time of day, a host-picked air temperature
        and wind that gusts. Wet grip, air density and altitude are baked
        into the session, so physics, AI and the racing line all follow: at
        2,240&nbsp;m a turbo keeps its power and a wing does not.
        Floodlights and headlights come on after dark.
    - tag: Hotlap
      title: Garage, ghost, repeat
      body: >-
        Time attack with sector splits, track limits and records that
        persist. Chase your best lap's ghost, replay it from the TV
        cameras, then work through {{ n.setup_knobs }} setup knobs shown in
        real units: psi, N/mm, millimetres of ride height.
    - tag: Track guide
      wide: true
      title: Every corner, walked through
      body: >-
        Open any circuit from the track picker and the guide plays it
        corner by corner: three clean laps by cars of your class, at speed
        or in slow motion, from trackside, broadcast, chase and onboard
        cameras. Each stop names the gear, the braking point and the
        entry and exit speeds measured from the lap, and warns about what
        the ground hides: a crest, a downhill braking zone, a wall close on
        the exit.
      chips: [Every circuit, Every class, Slow motion, Measured laps]
    - tag: Spectating
      wide: true
      title: Watch any race, keep any race
      body: >-
        Watch a session running on the server from the browser, or the race
        behind the menus, with a timing tower, a choice of car and camera,
        and the broadcast director on hand. Every session you drive is
        recorded on your machine; save the ones worth keeping and play them
        back paused, sped up or skipped through.
      chips: [Live sessions, Timing tower, Replays, Pause and seek]
    - tag: Racecraft
      wide: true
      title: AI and a TV director
      body: >-
        Deterministic AI drivers race in your car's class with a traffic
        layer, at a level the host sets, and drive to the grip they have:
        cold tyres, dirty air, a tailwind into a braking zone, a damaged
        wing. Behind the menus a recorded AI race plays, and a broadcast
        director follows its battles through trackside, helicopter and
        onboard shots.
      chips: [Class fields, Host-set level, Pit strategy, Broadcast cameras]
    - tag: Modding
      wide: true
      title: Open the files
      body: >-
        A car is a <code>car.toml</code> and a GLB. A circuit is an export
        the game builds as it loads. The HUD is {{ n.hud_components }} JSON
        components with an in-game layout editor. Nothing is cooked, so a
        change is a file save and a rescan. Tracks and cars from your own
        Assetto Corsa install import with one command, and stay on your
        machine.
      chips: [car.toml, Runtime tracks, JSON HUD, AC importers]

band:
  - image: band-left.webp
    alt: '{{ car("posh-gt3rs") }} from the rear'
    caption: '{{ car("posh-gt3rs") }} · {{ car_class("posh-gt3rs") }}'
  - image: band-right.webp
    alt: '{{ car("fugazzi-994p-hypercar") }} from the rear'
    caption: '{{ car("fugazzi-994p-hypercar") }} · {{ car_class("fugazzi-994p-hypercar") }}'

cars:
  eyebrow: The grid
  title: '{{ n.cars }} cars.<br>{{ n.classes|words|capitalize }} classes.'
  intro: >-
    Every car is a physics definition and a 3D model, read from the same
    files by the server and the client. The AI fills the field from your
    car's own class.
  # Keyed by the class in car.toml; `title` is what the page shows.
  classes:
    GT3:
      title: GT3
      text: >-
        Front-engined and mid-engined production racers: heavy, planted and
        forgiving at the limit. Steel brakes, big bodywork, bigger wings,
        and the most door-to-door racing on the calendar.
    LMP2:
      title: LMP2
      text: >-
        Spec-engine prototypes with naturally aspirated V8s. Closed
        canopies, long tails and downforce that builds with every km/h. The
        class that races through the night.
    Hypercar:
      title: Hypercar
      text: >-
        The top of endurance racing: hybrids from a naturally aspirated V12
        to a quad-turbo W16, each with an electric motor and a battery to
        manage. Over a tonne, and the longest straights to use it on.
    F1:
      title: Formula
      text: >-
        Open-wheel single-seaters with turbo V6s screaming to 15,000 rpm
        and half their power from the battery. The lightest cars, the most
        sensitive to ride height, and a lap that has to be energy-managed.
  liveries:
    eyebrow: Paint shop
    title: '{{ n.liveries|words|capitalize }} liveries a car'
    body: >-
      Liveries repaint paint, accent and logo at runtime on the race car
      and in the garage turntable. Pick yours in the lobby; the AI is dealt
      the rest in turn, so a full field never looks cloned.
    images:
      - {image: liveries-gt3-lmp2.webp, alt: Livery sheet for GT3 and LMP2 cars}
      - {image: liveries-hyper-f1.webp, alt: Livery sheet for Hypercar and Formula cars}
  # lamp details, under the liveries
  details:
    - {image: detail-1.webp, alt: GT3 headlight detail}
    - {image: detail-2.webp, alt: Prototype tail light detail}
    - {image: detail-3.webp, alt: Hypercar headlight detail}
    - {image: detail-4.webp, alt: GT3 tail light detail}

tracks:
  eyebrow: The calendar
  title: '{{ n.tracks }} circuits.<br>Surveyed, not sketched.'
  intro: >-
    Centerlines from public GPS traces, smoothed without shrinking the
    circuit, in {{ n.countries }} countries. The longest is the
    {{ n.longest_km }}&nbsp;km {{ name('Nordschleife') }}, routed over
    OpenStreetMap: {{ n.longest_relief }}&nbsp;m of relief, guard rail
    close to the road, the forest right behind it and the fans' graffiti on
    the asphalt. Banking is laid onto the bends it belongs to, and
    elevation comes from satellite surface models.
  featured: Spa
  note: >-
    ● green = real layout dossier (named corners, stands, pit lane,
    woodland from OpenStreetMap). Maps drawn from each circuit's own
    centerline data.

