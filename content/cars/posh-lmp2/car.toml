id = "7ffd2617-850c-4aee-9289-930d99492a37"
name = "Posh 963-ish LMP2"
version = "1.0.0"
model = "posh_lmp2.glb"
brand = "Posh"
model_year = 2026
class = "LMP2"
model_type = "RSP-2 Prototype"
manufacturer_country = "Germany"

[physics]
mass_kg = 935.0
length_m = 4.75
width_m = 1.9
max_engine_force_n = 9000.0
max_brake_force_n = 22000.0
drag_coefficient = 0.51
# Prototype slicks on a high-downforce chassis. Set with the other LMP2s so
# the racing line's ideal lap of Silverstone lands a few seconds off a real
# LMP2 pole (about 1:38); the sim's profile keeps a margin below the limit.
grip_coefficient = 1.52
max_steering_angle_rad = 0.42
wheelbase_m = 3.0

# Aerodynamics. Drag and downforce both scale with the reference area, so
# what counts is Cd*A (~0.9 m2) and Cl*A (~5 m2): well over a tonne of
# downforce at 250 km/h, 40% on the nose, which is what makes the car feel
# planted in the fast stuff and draggy on the straights compared with the GT3.
frontal_area_m2 = 1.7
lift_coefficient_front = -1.23
lift_coefficient_rear = -1.83

# Spec-series 4.2 L V8, restricted to ~402 kW; same class, a few kg and a few
# aero points apart from the Yotota so the four LMP2s race close but not identical.

[engine]
max_power_w = 402000.0
max_torque_nm = 515.0
idle_rpm = 1500.0
redline_rpm = 8100.0
max_rpm = 8300.0
rev_limiter_rpm = 8200.0

inertia_kg_m2 = 0.16
friction_torque_nm = 20.0
engine_brake_torque_nm = 110.0
idle_control_gain = 0.15

[[engine.torque_curve]]
rpm = 1500.0
torque_nm = 300.0

[[engine.torque_curve]]
rpm = 3500.0
torque_nm = 430.0

[[engine.torque_curve]]
rpm = 5000.0
torque_nm = 500.0

[[engine.torque_curve]]
rpm = 6200.0
torque_nm = 520.0

[[engine.torque_curve]]
rpm = 7400.0
torque_nm = 505.0

[[engine.torque_curve]]
rpm = 8200.0
torque_nm = 450.0

# What the client's engine synthesiser is built from (docs/CAR_MODELS.md, "Engine
# sound"): the server ignores this table.
# Spec 4.2 L flat-plane V8 on short open pipes.
[sound]
cylinders = 8
crossplane = false   # a crossplane V8's uneven banks; false fires the banks alternately
turbo = false
exhaust_length_m = 1.05   # primary pipe: where the exhaust resonates
muffling = 0.2           # 0 open pipes .. 1 road muffler
pops = 0.6               # overrun pops and shift cracks, 0..1
gear_whine = 0.45         # straight-cut gearbox, 0..1
intake_roar = 0.6        # induction noise under throttle, 0..1

[transmission]
transmission_type = "Sequential"
final_drive_ratio = 3.55
shift_time_s = 0.06
efficiency = 0.95

# 6 forward gears on 0.35 m wheels: 100 km/h in first at the limiter,
# 335 km/h in sixth — a Le Mans set-up; the car drags itself to ~325.
[transmission.ratio_curve]
gears = 6
first = 3.05
top = 0.92
shape = "progressive"

[drivetrain]
layout = "RWD"

[differential]
differential_type = "ClutchLSD"
preload_nm = 80.0
lock_power = 0.4
lock_coast = 0.30

[fuel]
capacity_liters = 75.0
idle_consumption_lps = 0.00006
load_consumption_scale = 0.0032

[hybrid]
enabled = false
battery_capacity_kwh = 0.0
battery_max_discharge_kw = 0.0
battery_max_charge_kw = 0.0
motor_max_torque_nm = 0.0
motor_max_power_kw = 0.0
regen_max_power_kw = 0.0

# Where the client draws the wheels, measured from the model (content/cars/
# strip_wheels.py): visual only, the physics reads its own figures above.
# Axles are metres ahead of (+) or behind (-) the model origin; the wheel
# model is content/wheels/<model>.glb, sized to each axle's radius and width.
[wheels]
model = "lmp2"
front_axle_m = 1.500
rear_axle_m = -1.500
front_track_m = 1.580
rear_track_m = 1.580
front_radius_m = 0.355
rear_radius_m = 0.365
front_width_m = 0.310
rear_width_m = 0.360

# --- liveries: written by content/cars/liveries.py, edits below this line are lost ---
# Livery 0 is the model as authored; these are 1, 2, 3 on the wire.

[[livery]]
name = "Orbital Heritage"
paint = [0.230, 0.520, 0.780]
accent = [0.950, 0.300, 0.020]
metallic = 0.25
logo = "textures/livery_heritage.png"

[[livery]]
