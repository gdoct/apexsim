[physics]
mass_kg = 1310.0
length_m = 4.7
width_m = 2.0
max_engine_force_n = 8500.0
max_brake_force_n = 15500.0
drag_coefficient = 0.35
# Retuned after the physically-correct normal-load + slip-model overhaul
# (cars lost the accidental ~2x grip): GT3 slick territory.
grip_coefficient = 1.19
max_steering_angle_rad = 0.51
wheelbase_m = 2.8

# Aerodynamics. Drag and downforce both scale with the reference area, so
# what counts is Cd*A (0.75 m2) and Cl*A (1.0 m2): a road GT3 with its wing,
# ~190 kg of downforce at 200 km/h, 40% of it on the nose.
frontal_area_m2 = 2.25
lift_coefficient_front = -0.2
lift_coefficient_rear = -0.33

# Engine & drivetrain simulation parameters.
# Notes:
# - The server currently uses these fields where available; otherwise it falls back to legacy defaults.
# - RPM values are in revolutions per minute, torque in N·m, power in Watts.

[engine]
# front-mid 6.3 L V8, naturally aspirated, torquey.
max_power_w = 405000.0
max_torque_nm = 650.0
idle_rpm = 850.0
redline_rpm = 7500.0
max_rpm = 7700.0
rev_limiter_rpm = 7650.0

# Rotational dynamics / losses
inertia_kg_m2 = 0.20
friction_torque_nm = 18.0
engine_brake_torque_nm = 95.0
idle_control_gain = 0.15

