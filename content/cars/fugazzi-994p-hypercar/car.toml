id = "941a167f-9633-4624-9873-f833e67b647e"
name = "Fugazzi 994P"
version = "1.0.0"
model = "fugazzi_994p.glb"
brand = "Fugazzi"
model_year = 2026
class = "Hypercar"
model_type = "994P"
manufacturer_country = "Italy"

[physics]
mass_kg = 1030.0
length_m = 5.0
width_m = 2.0
max_engine_force_n = 10000.0
max_brake_force_n = 24000.0
drag_coefficient = 0.54
# LMH slicks, wider than an LMP2's; with the heavier car and the capped aero
# the ideal Silverstone lap sits a couple of seconds under the LMP2s.
grip_coefficient = 1.54
max_steering_angle_rad = 0.40
wheelbase_m = 3.1

# Aerodynamics. LMH rules cap the aero efficiency (L/D about 4), so a
# hypercar carries less downforce than an LMP2 on a bigger, heavier car and
# makes it up with power: Cd*A ~1.05 m2, Cl*A ~5 m2, 41% on the nose.
frontal_area_m2 = 1.9
lift_coefficient_front = -1.07
lift_coefficient_rear = -1.54

# 3.0 L twin-turbo 120-degree V6 as a stressed member, ~450 kW, with the
# front-axle motor; torque is flat from 4500 to 7000.

[engine]
max_power_w = 450000.0
max_torque_nm = 650.0
idle_rpm = 1800.0
redline_rpm = 8600.0
max_rpm = 8900.0
rev_limiter_rpm = 8800.0

inertia_kg_m2 = 0.13
friction_torque_nm = 20.0
engine_brake_torque_nm = 115.0
idle_control_gain = 0.15

[[engine.torque_curve]]
rpm = 1800.0
torque_nm = 360.0

[[engine.torque_curve]]
rpm = 3500.0
torque_nm = 560.0

[[engine.torque_curve]]
rpm = 4500.0
torque_nm = 650.0

[[engine.torque_curve]]
rpm = 7000.0
torque_nm = 645.0

[[engine.torque_curve]]
rpm = 8000.0
torque_nm = 560.0

[[engine.torque_curve]]
rpm = 8600.0
torque_nm = 500.0

# What the client's engine synthesiser is built from (docs/CAR_MODELS.md,
# "Engine sound"): the server ignores this table.
# 3.0 L 120-degree twin-turbo V6, hot-vee, short pipes.
[sound]
cylinders = 6
crossplane = false
turbo = true
exhaust_length_m = 0.70
muffling = 0.18
pops = 0.60
gear_whine = 0.50
intake_roar = 0.45

[transmission]
transmission_type = "Sequential"
final_drive_ratio = 3.30
shift_time_s = 0.05
efficiency = 0.95

# 7 forward gears on the sim's 0.33 m rolling radius: ~120 km/h in
# first at the redline, ~360 in top; the car drags itself to ~330-340.
[transmission.ratio_curve]
gears = 7
first = 2.75
top = 0.90
shape = "progressive"

[drivetrain]
layout = "AWD"

[differential]
differential_type = "ClutchLSD"
preload_nm = 90.0
lock_power = 0.45
lock_coast = 0.30

[fuel]
capacity_liters = 90.0
idle_consumption_lps = 0.00006
load_consumption_scale = 0.0034

# The LMH energy recovery system: a front-axle motor, deployed on throttle
# and recharged under braking. The sim adds its torque at the crank.
[hybrid]
enabled = true
battery_capacity_kwh = 1.1
battery_max_discharge_kw = 95.0
battery_max_charge_kw = 200.0
motor_max_torque_nm = 200.0
motor_max_power_kw = 95.0
regen_max_power_kw = 200.0

# Where the client draws the wheels (content/cars/build_hypercar.py builds
# the body to this stance): visual only, the physics reads its own figures.
[wheels]
model = "hypercar"
front_axle_m = 1.550
rear_axle_m = -1.550
front_track_m = 1.620
rear_track_m = 1.620
front_radius_m = 0.360
rear_radius_m = 0.360
front_width_m = 0.320
rear_width_m = 0.345
