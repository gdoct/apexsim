id = "51a2eb0a-a3cf-4efc-b1dd-ca2b73b08ab1"
name = "Limbotiti Caravan GT3"
version = "1.0.0"
model = "limbotiti_caravan.glb"
brand = "Limbotiti"
model_year = 2026
class = "GT3"
model_type = "Caravan GT3"
manufacturer_country = "Italy"

[physics]
mass_kg = 1265.0
length_m = 4.5
width_m = 2.0
max_engine_force_n = 8500.0
max_brake_force_n = 15500.0
drag_coefficient = 0.37
# GT3 slicks. Set with the other GT3s so the racing line's ideal lap of
# Silverstone lands a few seconds off a real GT3 pole (about 1:58): the
# sim's profile keeps a margin below the limit, so ~2:02 is on the money.
grip_coefficient = 1.44
max_steering_angle_rad = 0.51
wheelbase_m = 2.7

# Aerodynamics. Drag and downforce both scale with the reference area, so
# what counts is Cd*A (~0.75 m2) and Cl*A (~2.1 m2): a GT3 wing and diffuser,
# ~400 kg of downforce at 200 km/h, 38% of it on the nose (behind the static
# weight split, which is what keeps the car understeering at the limit).
frontal_area_m2 = 2.1
lift_coefficient_front = -0.42
lift_coefficient_rear = -0.63

# Engine & drivetrain simulation parameters.
# Notes:
# - The server currently uses these fields where available; otherwise it falls back to legacy defaults.
# - RPM values are in revolutions per minute, torque in N·m, power in Watts.

[engine]
# mid-engined 5.2 L V10, naturally aspirated.
max_power_w = 390000.0
max_torque_nm = 560.0
idle_rpm = 950.0
redline_rpm = 8500.0
max_rpm = 8700.0
rev_limiter_rpm = 8650.0

# Rotational dynamics / losses
inertia_kg_m2 = 0.20
friction_torque_nm = 18.0
engine_brake_torque_nm = 95.0
idle_control_gain = 0.15

# Optional torque curve used by physics when provided.
# Provide points ordered by RPM.
[[engine.torque_curve]]
rpm = 944.4
torque_nm = 262.1

[[engine.torque_curve]]
rpm = 2833.3
torque_nm = 417.0

[[engine.torque_curve]]
rpm = 4250.0
torque_nm = 500.4

[[engine.torque_curve]]
rpm = 5761.1
torque_nm = 560.0

[[engine.torque_curve]]
rpm = 7555.6
torque_nm = 542.1

[[engine.torque_curve]]
rpm = 8500.0
torque_nm = 476.6

# What the client's engine synthesiser is built from (docs/CAR_MODELS.md, "Engine
# sound"): the server ignores this table.
# 5.2 L V10: five firings a rev, even into each bank - the wail.
[sound]
cylinders = 10
crossplane = false   # a crossplane V8's uneven banks; false fires the banks alternately
turbo = false
exhaust_length_m = 1.1   # primary pipe: where the exhaust resonates
muffling = 0.22           # 0 open pipes .. 1 road muffler
pops = 0.6               # overrun pops and shift cracks, 0..1
gear_whine = 0.3         # straight-cut gearbox, 0..1
intake_roar = 0.6        # induction noise under throttle, 0..1

[transmission]
# One of: Manual, DCT, Sequential, Automatic, CVT
transmission_type = "Sequential"

final_drive_ratio = 3.8

# Shift timing and drivetrain efficiency
shift_time_s = 0.08
efficiency = 0.93

# 6 forward gears: a long first (72 km/h at the 9000 rpm limiter) for getting
# off the line, closing up to 321 km/h in sixth.
[transmission.ratio_curve]
gears = 6
first = 3.7
top = 0.88
shape = "progressive"

[drivetrain]
# One of: RWD, FWD, AWD
layout = "RWD"

[differential]
# One of: Open, Locked, ClutchLSD, ViscousLSD, Torsen
differential_type = "ClutchLSD"
preload_nm = 60.0
lock_power = 0.35
lock_coast = 0.20

[fuel]
capacity_liters = 64.0
idle_consumption_lps = 0.00005
load_consumption_scale = 0.003

[hybrid]
enabled = false
battery_capacity_kwh = 0.0
battery_max_discharge_kw = 0.0
battery_max_charge_kw = 0.0
motor_max_torque_nm = 0.0
motor_max_power_kw = 0.0
regen_max_power_kw = 0.0

# Where the client draws the wheels, measured from the model (content/cars/
# strip_wheels.py): visual only, the physics reads its own figures above.
# Axles are metres ahead of (+) or behind (-) the model origin; the wheel
# model is content/wheels/<model>.glb, sized to each axle's radius and width.
[wheels]
model = "gt3"
front_axle_m = 1.375
rear_axle_m = -1.375
front_track_m = 1.700
rear_track_m = 1.700
front_radius_m = 0.345
rear_radius_m = 0.355
front_width_m = 0.300
rear_width_m = 0.330

# --- liveries: written by content/cars/liveries.py, edits below this line are lost ---
# Livery 0 is the model as authored; these are 1, 2, 3 on the wire.

[[livery]]
name = "Aurum Black"
paint = [0.010, 0.010, 0.012]
accent = [0.720, 0.500, 0.120]
metallic = 0.55
logo = "textures/livery_blackgold.png"

[[livery]]
name = "Tide Sunset"
paint = [0.000, 0.300, 0.320]
accent = [0.950, 0.400, 0.020]
metallic = 0.50
logo = "textures/livery_tide.png"

[[livery]]
name = "Polaris Arctic"
paint = [0.740, 0.770, 0.810]
accent = [0.030, 0.300, 0.620]
metallic = 0.75
logo = "textures/livery_arctic.png"
