id = "f6a7b8c9-d0e1-4f6a-3b4c-5d6e7f8a9b0c"
name = "Red Horse RB20"
version = "1.0.0"
model = "rb20.glb"
brand = "Red Horse"
model_year = 2020
class = "F1"
model_type = "RB20"
manufacturer_country = "Austria"

[physics]
mass_kg = 798.0
length_m = 5.6
width_m = 2.0
max_engine_force_n = 26000.0
max_brake_force_n = 21000.0
drag_coefficient = 0.68
grip_coefficient = 1.85
max_steering_angle_rad = 0.34
wheelbase_m = 3.6

# Aerodynamics. Drag and downforce both scale with the reference area, so
# what counts is Cd*A (1.5 m2) and Cl*A (4.4 m2): the car's own weight in
# downforce by ~190 km/h and ~3 g of it at 330. The balance is 42% front,
# behind the static weight, so the car gets more stable as speed rises.
frontal_area_m2 = 2.2
lift_coefficient_front = -0.84
lift_coefficient_rear = -1.16

# Powertrain (approximate / semantically-correct for modern F1 hybrid).

[engine]
# ICE peak power (hybrid contribution is configured in [hybrid])
max_power_w = 550000.0
max_torque_nm = 520.0
idle_rpm = 4500.0
redline_rpm = 15000.0
max_rpm = 15500.0
rev_limiter_rpm = 15500.0

inertia_kg_m2 = 0.12
friction_torque_nm = 30.0
engine_brake_torque_nm = 120.0
idle_control_gain = 0.10

[[engine.torque_curve]]
rpm = 5000.0
torque_nm = 360.0

[[engine.torque_curve]]
rpm = 9000.0
torque_nm = 500.0

[[engine.torque_curve]]
rpm = 11000.0
torque_nm = 520.0

[[engine.torque_curve]]
rpm = 13000.0
torque_nm = 500.0

[[engine.torque_curve]]
rpm = 15000.0
torque_nm = 430.0

# What the client's engine synthesiser is built from (docs/CAR_MODELS.md, "Engine
# sound"): the server ignores this table.
# 1.6 L turbo-hybrid V6 revving to 15,000 through one short, open tailpipe.
[sound]
cylinders = 6
crossplane = false   # a crossplane V8's uneven banks; false fires the banks alternately
turbo = true
exhaust_length_m = 0.65   # primary pipe: where the exhaust resonates
muffling = 0.08           # 0 open pipes .. 1 road muffler
pops = 0.15               # overrun pops and shift cracks, 0..1
gear_whine = 0.4         # straight-cut gearbox, 0..1
intake_roar = 0.4        # induction noise under throttle, 0..1

[transmission]
transmission_type = "Sequential"

final_drive_ratio = 3.20

shift_time_s = 0.06
efficiency = 0.96

# 8 forward gears (representative, not team-specific): first runs to 122 km/h
# and eighth to 335 at the 15 000 rpm limiter, a shade past the ~320 the car
# can drag its way to.
[transmission.ratio_curve]
gears = 8
first = 4.78
top = 1.74
shape = "progressive"

[drivetrain]
layout = "RWD"

[differential]
differential_type = "ClutchLSD"
preload_nm = 40.0
lock_power = 0.25
lock_coast = 0.15

[fuel]
capacity_liters = 110.0
idle_consumption_lps = 0.00008
load_consumption_scale = 0.004

[hybrid]
enabled = true

# F1 Energy Store is MJ-scale; this is a convenient kWh equivalent for sim.
battery_capacity_kwh = 1.2
battery_max_discharge_kw = 120.0
battery_max_charge_kw = 120.0
motor_max_torque_nm = 200.0
motor_max_power_kw = 120.0
regen_max_power_kw = 120.0

# Where the client draws the wheels, measured from the model (content/cars/
# strip_wheels.py): visual only, the physics reads its own figures above.
# Axles are metres ahead of (+) or behind (-) the model origin; the wheel
# model is content/wheels/<model>.glb, sized to each axle's radius and width.
[wheels]
model = "f1"
front_axle_m = 1.476
rear_axle_m = -1.992
front_track_m = 1.572
rear_track_m = 1.519
front_radius_m = 0.353
rear_radius_m = 0.353
front_width_m = 0.385
rear_width_m = 0.415
