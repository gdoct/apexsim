id = "3f291d76-c43d-4515-a04d-e12c2a71e23f"
name = "Fugazzi LMP2"
version = "1.0.0"
model = "fugazzi_lmp2.glb"
brand = "Fugazzi"
model_year = 2026
class = "LMP2"
model_type = "F-P2 Corsa"
manufacturer_country = "Italy"

[physics]
mass_kg = 925.0
length_m = 4.75
width_m = 1.9
max_engine_force_n = 9000.0
max_brake_force_n = 22000.0
drag_coefficient = 0.53
# Prototype slicks on a high-downforce chassis. Set with the other LMP2s so
# the racing line's ideal lap of Silverstone lands a few seconds off a real
# LMP2 pole (about 1:38); the sim's profile keeps a margin below the limit.
grip_coefficient = 1.52
max_steering_angle_rad = 0.42
wheelbase_m = 3.0

# Aerodynamics. Drag and downforce both scale with the reference area, so
# what counts is Cd*A (~0.9 m2) and Cl*A (~5 m2): well over a tonne of
# downforce at 250 km/h, 40% on the nose, which is what makes the car feel
# planted in the fast stuff and draggy on the straights compared with the GT3.
frontal_area_m2 = 1.7
lift_coefficient_front = -1.35
lift_coefficient_rear = -1.95

# Spec-series 4.2 L V8, restricted to ~405 kW; same class, a few kg and a few
# aero points apart from the Yotota so the four LMP2s race close but not identical.

# Aero posture (server/src/aero.rs): a prototype floor, less sensitive
# than an F1's and run a little higher.
[aero]
# Attitude (server/src/aero.rs): downforce lost per degree the car runs
# sideways to the air and per degree of roll; and how much the floor
# porpoises when run near its stall height at speed (0 never).
yaw_sensitivity = 0.004
roll_sensitivity = 0.010
porpoising = 0.3
ride_height_front_m = 0.050
ride_height_rear_m = 0.080
ride_height_sensitivity = 0.02
rake_sensitivity = 0.008
stall_height_m = 0.012

# Tyres: the spec slick's working window (server/src/tyre_thermal.rs).
# No blankets: the car goes out at the air temperature.
[tires]
optimal_temperature_c = 92.0
temperature_window_c = 10.0

[engine]
max_power_w = 405000.0
max_torque_nm = 525.0
idle_rpm = 1500.0
redline_rpm = 8400.0
max_rpm = 8600.0
rev_limiter_rpm = 8500.0

inertia_kg_m2 = 0.16
friction_torque_nm = 20.0
engine_brake_torque_nm = 110.0
idle_control_gain = 0.15

[[engine.torque_curve]]
rpm = 1500.0
torque_nm = 300.0

[[engine.torque_curve]]
rpm = 3500.0
torque_nm = 430.0

[[engine.torque_curve]]
rpm = 5000.0
torque_nm = 500.0

[[engine.torque_curve]]
rpm = 6200.0
torque_nm = 520.0

[[engine.torque_curve]]
rpm = 7400.0
torque_nm = 505.0

[[engine.torque_curve]]
rpm = 8200.0
torque_nm = 450.0

# What the client's engine synthesiser is built from (docs/content/cars.md, "Engine
# sound"): the server ignores this table.
# Spec 4.2 L flat-plane V8 on short open pipes.
[sound]
cylinders = 8
crossplane = false   # a crossplane V8's uneven banks; false fires the banks alternately
turbo = false
exhaust_length_m = 0.85   # primary pipe: where the exhaust resonates
muffling = 0.12           # 0 open pipes .. 1 road muffler
pops = 0.65               # overrun pops and shift cracks, 0..1
gear_whine = 0.45         # straight-cut gearbox, 0..1
intake_roar = 0.65        # induction noise under throttle, 0..1

[transmission]
transmission_type = "Sequential"
final_drive_ratio = 3.65
shift_time_s = 0.06
efficiency = 0.95

# 6 forward gears on 0.35 m wheels: 100 km/h in first at the limiter,
# 335 km/h in sixth — a Le Mans set-up; the car drags itself to ~325.
[transmission.ratio_curve]
gears = 6
first = 2.95
top = 0.88
shape = "progressive"

[drivetrain]
layout = "RWD"

[differential]
# Run the limited-slip model (server/src/physics.rs `split_axle_torque`):
# without it each driven wheel gets half the axle's torque whatever it can use.
simulated = true
differential_type = "ClutchLSD"
preload_nm = 80.0
lock_power = 0.5
lock_coast = 0.30

[fuel]
# Where the tank sits as a share of the way from the rear axle to the front
# (server/src/data.rs `laden`): the car's balance moves as it drains.
tank_front_share = 0.50
capacity_liters = 75.0
idle_consumption_lps = 0.00006
# Share of the fuel's energy the engine turns into work (a racing petrol engine);
# consumption follows the power it makes.
thermal_efficiency = 0.33

[hybrid]
enabled = false
battery_capacity_kwh = 0.0
battery_max_discharge_kw = 0.0
battery_max_charge_kw = 0.0
motor_max_torque_nm = 0.0
motor_max_power_kw = 0.0
regen_max_power_kw = 0.0

# Suspension geometry (server/src/geometry.rs): static camber per axle
# (negative: the wheel's top toward the car), how much of the body's roll
# the linkage gains back, toe per wheel (positive toe-in) and the bump
# stops (gap past the static laden compression, rate). The springs and
# dampers are still the sim's defaults. The grip is measured against this
# camber, so the setup garage's camber clicks move it from here.
[suspension]
# Roll centres (m above the road: the share of each axle's lateral load
# transfer that goes through its linkage at once rather than its springs),
# camber thrust (side force per radian of lean, as a share of the cornering
# stiffness) and a bump stop gap per axle (server/src/geometry.rs).
roll_centre_front_m = 0.030
roll_centre_rear_m = 0.060
camber_thrust = 0.08
bump_stop_gap_front_m = 0.030
bump_stop_gap_rear_m = 0.035
camber_front_deg = -3.0
camber_rear_deg = -2.0
camber_gain_front = 0.55
camber_gain_rear = 0.55
toe_front_deg = -0.05
toe_rear_deg = 0.15
bump_stop_gap_m = 0.03
bump_stop_rate_n_per_m = 200000.0

# Where the client draws the wheels, measured from the model (content/cars/
# strip_wheels.py): visual only, the physics reads its own figures above.
# Axles are metres ahead of (+) or behind (-) the model origin; the wheel
# model is content/wheels/<model>.glb, sized to each axle's radius and width.
[wheels]
model = "lmp2"
front_axle_m = 1.500
rear_axle_m = -1.500
front_track_m = 1.580
rear_track_m = 1.580
front_radius_m = 0.355
rear_radius_m = 0.365
front_width_m = 0.310
rear_width_m = 0.360

[driver]
# the driver, drawn on the body (same frame) and hidden for the car the
# cockpit camera sits in; written by the build script
model = "fugazzi_lmp2_driver.glb"

[cockpit]
# Written by the build script: the eye and wheel the cabin was built to
# (car frame: +X nose, +Y right, +Z up). The client uses these instead of
# deriving them from the mesh box, so the greenhouse can sit where a
# real one does. Remove a key to fall back to the derivation.
# LMP2: the seat ahead of the middle of the wheelbase, a hand off centre.
style = "closed"
eye_cm = [13.0, -18.0, 82.0]
wheel_cm = [53.0, -18.0, 62.0]
mirror_left_cm = [55.8, -63.0, 69.7]
mirror_left_size_cm = [16.0, 6.0]
mirror_right_cm = [55.8, 63.0, 69.7]
mirror_right_size_cm = [16.0, 6.0]
# Rim turn at full steering, centre to lock (AC's STEER_LOCK). With a
# wheel on the Auto steering lock the real rim turns twice this lock to lock.
wheel_lock_deg = 180.0

[[damage_part]]
# written by scripts/content/cars/damage_parts.py from the body's geometry
name = "nose"
zone = "front"
detach_pct = 45
min_m = [1.935, -1.064, -0.073]   # forward, left, up
max_m = [2.553, 1.064, 0.450]

[[damage_part]]
# written by scripts/content/cars/damage_parts.py from the body's geometry
name = "rear_wing"
zone = "rear"
detach_pct = 50
min_m = [-2.515, -1.064, 0.957]   # forward, left, up
max_m = [-1.675, 1.064, 1.300]

