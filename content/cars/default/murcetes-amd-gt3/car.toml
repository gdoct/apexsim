id = "a442d320-0aec-4d60-822a-289563bc558b"
name = "Murcetes-AMD GT3"
version = "1.0.0"
model = "murcetes_amd_gt3.glb"
brand = "Murcetes-AMD"
model_year = 2026
class = "GT3"
model_type = "GT3 Evo"
manufacturer_country = "Germany"

[physics]
mass_kg = 1310.0
length_m = 4.7
width_m = 2.0
max_engine_force_n = 8500.0
max_brake_force_n = 15500.0
drag_coefficient = 0.35
# GT3 slicks. Set with the other GT3s so the racing line's ideal lap of
# Silverstone lands a few seconds off a real GT3 pole (about 1:58): the
# sim's profile keeps a margin below the limit, so ~2:02 is on the money.
grip_coefficient = 1.42
max_steering_angle_rad = 0.51
wheelbase_m = 2.8

# Aerodynamics. Drag and downforce both scale with the reference area, so
# what counts is Cd*A (~0.75 m2) and Cl*A (~2.1 m2): a GT3 wing and diffuser,
# ~400 kg of downforce at 200 km/h, 38% of it on the nose (behind the static
# weight split, which is what keeps the car understeering at the limit).
frontal_area_m2 = 2.25
lift_coefficient_front = -0.35
lift_coefficient_rear = -0.58

# Engine & drivetrain simulation parameters.
# Notes:
# - The server currently uses these fields where available; otherwise it falls back to legacy defaults.
# - RPM values are in revolutions per minute, torque in N·m, power in Watts.

# Aero posture (server/src/aero.rs): a flat-bottomed GT, high and only
# a little sensitive to its height.
[aero]
# Attitude (server/src/aero.rs): downforce lost per degree the car runs
# sideways to the air and per degree of roll; and how much the floor
# porpoises when run near its stall height at speed (0 never).
yaw_sensitivity = 0.002
roll_sensitivity = 0.006
porpoising = 0.0
ride_height_front_m = 0.070
ride_height_rear_m = 0.090
ride_height_sensitivity = 0.01
rake_sensitivity = 0.006
stall_height_m = 0.015

# Tyres: a GT slick, soft and quick to come in, with a lower window
# (server/src/tyre_thermal.rs). No blankets: out at the air temperature.
[tires]
optimal_temperature_c = 87.0
temperature_window_c = 10.0

[engine]
# front-mid 6.3 L V8, naturally aspirated, torquey.
max_power_w = 405000.0
max_torque_nm = 650.0
idle_rpm = 850.0
redline_rpm = 7500.0
max_rpm = 7700.0
rev_limiter_rpm = 7650.0

# Rotational dynamics / losses
inertia_kg_m2 = 0.20
friction_torque_nm = 18.0
engine_brake_torque_nm = 95.0
idle_control_gain = 0.15

# Optional torque curve used by physics when provided.
# Provide points ordered by RPM.
[[engine.torque_curve]]
rpm = 833.3
torque_nm = 304.3

[[engine.torque_curve]]
rpm = 2500.0
torque_nm = 484.0

[[engine.torque_curve]]
rpm = 3750.0
torque_nm = 580.9

[[engine.torque_curve]]
rpm = 5083.3
torque_nm = 650.0

[[engine.torque_curve]]
rpm = 6666.7
torque_nm = 629.3

[[engine.torque_curve]]
rpm = 7500.0
torque_nm = 553.2

# What the client's engine synthesiser is built from (docs/content/cars.md, "Engine
# sound"): the server ignores this table.
# 6.3 L crossplane V8 on side pipes: the uneven firing into each bank is the burble,
# and it pops on every lift.
[sound]
cylinders = 8
crossplane = true   # a crossplane V8's uneven banks; false fires the banks alternately
turbo = false
exhaust_length_m = 1.9   # primary pipe: where the exhaust resonates
muffling = 0.45           # 0 open pipes .. 1 road muffler
pops = 0.9               # overrun pops and shift cracks, 0..1
gear_whine = 0.3         # straight-cut gearbox, 0..1
intake_roar = 0.6        # induction noise under throttle, 0..1

[transmission]
# One of: Manual, DCT, Sequential, Automatic, CVT
transmission_type = "Sequential"

final_drive_ratio = 3.6

# Shift timing and drivetrain efficiency
shift_time_s = 0.08
efficiency = 0.93

# 6 forward gears: a long first (72 km/h at the 9000 rpm limiter) for getting
# off the line, closing up to 321 km/h in sixth.
[transmission.ratio_curve]
gears = 6
first = 3.4
top = 0.85
shape = "progressive"

[drivetrain]
# One of: RWD, FWD, AWD
layout = "RWD"

[differential]
# Run the limited-slip model (server/src/physics.rs `split_axle_torque`):
# without it each driven wheel gets half the axle's torque whatever it can use.
simulated = true
# One of: Open, Locked, ClutchLSD, ViscousLSD, Torsen
differential_type = "ClutchLSD"
preload_nm = 60.0
lock_power = 0.35
lock_coast = 0.20

[fuel]
# Where the tank sits as a share of the way from the rear axle to the front
# (server/src/data.rs `laden`): the car's balance moves as it drains.
tank_front_share = 0.35
capacity_liters = 64.0
idle_consumption_lps = 0.00005
# Share of the fuel's energy the engine turns into work (a racing petrol engine);
# consumption follows the power it makes.
thermal_efficiency = 0.33

[hybrid]
enabled = false
battery_capacity_kwh = 0.0
battery_max_discharge_kw = 0.0
battery_max_charge_kw = 0.0
motor_max_torque_nm = 0.0
motor_max_power_kw = 0.0
regen_max_power_kw = 0.0

# Suspension geometry (server/src/geometry.rs): static camber per axle
# (negative: the wheel's top toward the car), how much of the body's roll
# the linkage gains back, toe per wheel (positive toe-in) and the bump
# stops (gap past the static laden compression, rate). The springs and
# dampers are still the sim's defaults. The grip is measured against this
# camber, so the setup garage's camber clicks move it from here.
[suspension]
# Roll centres (m above the road: the share of each axle's lateral load
# transfer that goes through its linkage at once rather than its springs),
# camber thrust (side force per radian of lean, as a share of the cornering
# stiffness) and a bump stop gap per axle (server/src/geometry.rs).
roll_centre_front_m = 0.050
roll_centre_rear_m = 0.090
camber_thrust = 0.10
bump_stop_gap_front_m = 0.040
bump_stop_gap_rear_m = 0.045
camber_front_deg = -3.5
camber_rear_deg = -2.8
camber_gain_front = 0.45
camber_gain_rear = 0.45
toe_front_deg = -0.1
toe_rear_deg = 0.2
bump_stop_gap_m = 0.04
bump_stop_rate_n_per_m = 180000.0

# Where the client draws the wheels, measured from the model (content/cars/
# strip_wheels.py): visual only, the physics reads its own figures above.
# Axles are metres ahead of (+) or behind (-) the model origin; the wheel
# model is content/wheels/<model>.glb, sized to each axle's radius and width.
[wheels]
model = "gt3"
front_axle_m = 1.375
rear_axle_m = -1.375
front_track_m = 1.700
rear_track_m = 1.700
front_radius_m = 0.345
rear_radius_m = 0.355
front_width_m = 0.300
rear_width_m = 0.330

[driver]
# the driver, drawn on the body (same frame) and hidden for the car the
# cockpit camera sits in; written by the build script
model = "murcetes_amd_gt3_driver.glb"

[cockpit]
# Written by the build script: the eye and wheel the cabin was built to
# (car frame: +X nose, +Y right, +Z up). The client uses these instead of
# deriving them from the mesh box, so the greenhouse can sit where a
# real one does. Remove a key to fall back to the derivation.
# GT3: the seat where the class puts it.
style = "closed"
eye_cm = [-60.0, -36.0, 97.0]
wheel_cm = [-20.0, -36.0, 77.0]
mirror_left_cm = [2.9, -89.4, 90.6]
mirror_left_size_cm = [17.0, 6.5]
mirror_right_cm = [2.9, 89.4, 90.6]
mirror_right_size_cm = [17.0, 6.5]
# Rim turn at full steering, centre to lock (AC's STEER_LOCK). With a
# wheel on the Auto steering lock the real rim turns twice this lock to lock.
wheel_lock_deg = 270.0

[[damage_part]]
# written by scripts/content/cars/damage_parts.py from the body's geometry
name = "nose"
zone = "front"
detach_pct = 50
min_m = [1.800, -1.159, -0.047]   # forward, left, up
max_m = [2.472, 1.159, 0.540]

[[damage_part]]
# written by scripts/content/cars/damage_parts.py from the body's geometry
name = "rear_wing"
zone = "rear"
detach_pct = 55
min_m = [-2.530, -1.159, 1.040]   # forward, left, up
max_m = [-1.880, 1.159, 1.435]

