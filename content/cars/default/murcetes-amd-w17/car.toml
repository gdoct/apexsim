id = "d1d4e751-ee64-4b0f-b0bf-5db1caa6bd43"
name = "Murcetes-AMD W17"
version = "1.0.0"
model = "murcetes_w17.glb"
brand = "Murcetes-AMD"
model_year = 2026
class = "F1"
model_type = "W17"
manufacturer_country = "Germany"

[physics]
mass_kg = 778.0
length_m = 5.6
width_m = 1.9
max_engine_force_n = 24000.0
max_brake_force_n = 21000.0
drag_coefficient = 0.65
grip_coefficient = 1.80
max_steering_angle_rad = 0.34
wheelbase_m = 3.4

# Aerodynamics, 2026 rules: smaller and lighter than the ground-effect cars
# of 2022-25 with less downforce and less drag - Cd*A ~1.45 m2, Cl*A ~4.3 m2,
# 42% on the nose. Built by scripts/content/cars/build_f1.py.
frontal_area_m2 = 2.2
lift_coefficient_front = -0.8
lift_coefficient_rear = -1.12

# Narrow-pod silver arrow: the least drag of the four, a touch less
# downforce to go with it.

# Aero posture (server/src/aero.rs): a ground-effect floor, low and very
# sensitive to height, with rake moving the balance forward.
[aero]
# Attitude (server/src/aero.rs): downforce lost per degree the car runs
# sideways to the air and per degree of roll; and how much the floor
# porpoises when run near its stall height at speed (0 never).
yaw_sensitivity = 0.006
roll_sensitivity = 0.015
porpoising = 0.6
ride_height_front_m = 0.045
ride_height_rear_m = 0.090
ride_height_sensitivity = 0.03   # share of downforce per cm lower
rake_sensitivity = 0.010         # front balance shift per cm more rake
stall_height_m = 0.012

# Tyres: the slick's working window (server/src/tyre_thermal.rs). The
# car goes out on 70 °C blankets, as the rules allow.
[tires]
optimal_temperature_c = 91.0
temperature_window_c = 13.0
blanket_temperature_c = 70.0

# 2026 power unit: the 1.6 L V6 down to ~400 kW, the electric half up to
# 300 kW from a small store, so a lap is energy-managed: the battery is empty
# after ~13 s of full deployment and refills under braking.
[engine]
forced_induction = true   # turbocharged: holds its power in thin air
max_power_w = 400000.0
max_torque_nm = 355.5
idle_rpm = 4500.0
redline_rpm = 15000.0
max_rpm = 15500.0
rev_limiter_rpm = 15200.0

inertia_kg_m2 = 0.10
friction_torque_nm = 28.0
engine_brake_torque_nm = 110.0
idle_control_gain = 0.10

[[engine.torque_curve]]
rpm = 5000.0
torque_nm = 252.5

[[engine.torque_curve]]
rpm = 8000.0
torque_nm = 323.2

[[engine.torque_curve]]
rpm = 10500.0
torque_nm = 355.5

[[engine.torque_curve]]
rpm = 12000.0
torque_nm = 335.3

[[engine.torque_curve]]
rpm = 13500.0
torque_nm = 294.9

[[engine.torque_curve]]
rpm = 15000.0
torque_nm = 248.5

# What the client's engine synthesiser is built from (docs/CAR_MODELS.md,
# "Engine sound"): the server ignores this table.
# 1.6 L turbo V6 to 15,000 through one short, open tailpipe.
[sound]
cylinders = 6
crossplane = false
turbo = true
exhaust_length_m = 0.62
muffling = 0.07
pops = 0.12
gear_whine = 0.4
intake_roar = 0.4

[transmission]
transmission_type = "Sequential"
final_drive_ratio = 3.15
shift_time_s = 0.04
efficiency = 0.96

# 8 forward gears on the sim's 0.33 m rolling radius: 120 km/h in first and
# ~345 in eighth at 15,000; the car drags itself to ~330 with the battery full.
[transmission.ratio_curve]
gears = 8
first = 4.94
top = 1.72
shape = "progressive"

[drivetrain]
layout = "RWD"

[differential]
# Run the limited-slip model (server/src/physics.rs `split_axle_torque`):
# without it each driven wheel gets half the axle's torque whatever it can use.
simulated = true
differential_type = "ClutchLSD"
preload_nm = 40.0
lock_power = 0.25
lock_coast = 0.15

[fuel]
# Where the tank sits as a share of the way from the rear axle to the front
# (server/src/data.rs `laden`): the car's balance moves as it drains.
tank_front_share = 0.45
capacity_liters = 100.0
idle_consumption_lps = 0.00008
# Share of the fuel's energy the engine turns into work (a current F1 power unit's combustion engine);
# consumption follows the power it makes.
thermal_efficiency = 0.50

[hybrid]
# Brake-by-wire: the recovery stands in for the driven axle's hydraulic
# brakes, so the pedal decelerates the car the same (server/src/hybrid.rs).
brake_by_wire = true
# The overtake button's own allowance per lap, kJ, over the paced budget.
override_kj_per_lap = 1500.0
enabled = true
battery_capacity_kwh = 1.1
battery_max_discharge_kw = 300.0
battery_max_charge_kw = 250.0
motor_max_torque_nm = 300.0
motor_max_power_kw = 300.0
regen_max_power_kw = 250.0
# A lap's deployment budget, kJ, spent between two crossings of the line
# (server/src/hybrid.rs); the Balanced mode paces it over the lap.
deploy_kj_per_lap = 4000.0

# Suspension geometry (server/src/geometry.rs): static camber per axle
# (negative: the wheel's top toward the car), how much of the body's roll
# the linkage gains back, toe per wheel (positive toe-in) and the bump
# stops (gap past the static laden compression, rate). The springs and
# dampers are still the sim's defaults. The grip is measured against this
# camber, so the setup garage's camber clicks move it from here.
[suspension]
# Roll centres (m above the road: the share of each axle's lateral load
# transfer that goes through its linkage at once rather than its springs),
# camber thrust (side force per radian of lean, as a share of the cornering
# stiffness) and a bump stop gap per axle (server/src/geometry.rs).
roll_centre_front_m = 0.020
roll_centre_rear_m = 0.050
camber_thrust = 0.08
bump_stop_gap_front_m = 0.020
bump_stop_gap_rear_m = 0.025
camber_front_deg = -3.0
camber_rear_deg = -1.8
camber_gain_front = 0.6
camber_gain_rear = 0.6
toe_front_deg = -0.05
toe_rear_deg = 0.15
bump_stop_gap_m = 0.02
bump_stop_rate_n_per_m = 200000.0

# Where the client draws the wheels (build_f1.py builds the car to this
# stance): visual only, the physics reads its own figures above.
[wheels]
model = "f1"
front_axle_m = 1.650
rear_axle_m = -1.750
front_track_m = 1.580
rear_track_m = 1.520
front_radius_m = 0.360
rear_radius_m = 0.360
front_width_m = 0.305
rear_width_m = 0.375

[driver]
# the driver, drawn on the body (same frame) and hidden for the car the
# cockpit camera sits in; written by the build script
model = "murcetes_w17_driver.glb"

[drs_flap]
# the rear wing's upper element, cut out of the body so the client can open it
model = "murcetes_w17_drs.glb"
hinge_forward_m = -2.5056
hinge_up_m = 0.9429
open_deg = 25.0

[cockpit]
# Written by the build script: the eye and wheel the cabin was built to
# (car frame: +X nose, +Y right, +Z up). The client uses these instead of
# deriving them from the mesh box, so the greenhouse can sit where a
# real one does. Remove a key to fall back to the derivation.
# Pass 6: authored against the imported F1s (1.43-1.57 m behind the front axle).
style = "open"
eye_cm = [13.0, -0.0, 79.0]
wheel_cm = [53.0, -0.0, 62.0]
wheel_rake_deg = 12.0
mirror_left_cm = [69.8, -50.0, 73.0]
mirror_left_size_cm = [15.0, 5.0]
mirror_right_cm = [69.8, 50.0, 73.0]
mirror_right_size_cm = [15.0, 5.0]
# Rim turn at full steering, centre to lock (AC's STEER_LOCK). With a
# wheel on the Auto steering lock the real rim turns twice this lock to lock.
wheel_lock_deg = 180.0

[[damage_part]]
# written by scripts/content/cars/damage_parts.py from the body's geometry
name = "front_wing"
zone = "front"
detach_pct = 30
min_m = [2.545, -1.012, -0.094]   # forward, left, up
max_m = [3.125, 1.012, 0.500]

[[damage_part]]
# written by scripts/content/cars/damage_parts.py from the body's geometry
name = "rear_wing"
zone = "rear"
detach_pct = 45
min_m = [-2.631, -1.012, 0.756]   # forward, left, up
max_m = [-2.051, 1.012, 1.088]

