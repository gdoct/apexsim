name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --check

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Clippy
        # TODO: ratchet to -D warnings once the existing warnings are burned down
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test

  client:
    name: Client (Godot C#)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-godot
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test ApexSim.Tests
