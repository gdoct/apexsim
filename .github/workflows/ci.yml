name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --check

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  client:
    name: Client (Unreal project sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-unreal
    steps:
      - uses: actions/checkout@v5

      - name: Validate project metadata
        run: |
          jq -e '
            .FileVersion == 3 and
            .EngineAssociation == "5.8" and
            ([.Modules[] | select(.Name == "ApexSim" and .Type == "Runtime")] | length == 1) and
            ([.Modules[] | select(.Name == "ApexSimNet" and .Type == "Runtime")] | length == 1)
          ' ApexSim.uproject

      - name: Verify target and module definitions
        run: |
          test -f Source/ApexSim.Target.cs
          test -f Source/ApexSimEditor.Target.cs
          test -f Source/ApexSim/ApexSim.Build.cs
          test -f Source/ApexSimNet/ApexSimNet.Build.cs
          grep -q 'class ApexSimTarget' Source/ApexSim.Target.cs
          grep -q 'class ApexSimEditorTarget' Source/ApexSimEditor.Target.cs
