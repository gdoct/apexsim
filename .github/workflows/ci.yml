name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The repository holds three roots: apexsim/ (the code), apexsim-content/
# (cars, tracks, the track pipeline) and apexsim-lib/ (the formats both
# read). The code reaches the content through ../apexsim-content and both
# build against ../apexsim-lib, so every job checks out the whole repository.
jobs:
  formats:
    name: Formats (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apexsim-lib/formats
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apexsim-lib/formats

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The YAML rewrite and the sidecars' golden bytes.
      - name: Test
        run: cargo test

  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apexsim/server
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apexsim/server
            apexsim/server/ffi

      - name: Check formatting
        run: cargo fmt --check

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # --no-fail-fast: one failing test binary does not hide the next.
      # CI has no baked sidecars (they are gitignored), so a test that needs
      # one skips itself with a note rather than failing.
      - name: Test
        run: cargo test --no-fail-fast

      # The physics library for the client's prediction: the server's car
      # step behind a C API, checked against a session on a recorded trace.
      - name: Physics library (fmt, clippy, test)
        working-directory: apexsim/server/ffi
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  track-editor:
    name: Track pipeline and editor (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        # The ats-* tools and the editor resolve tracks/, build/tracks and
        # .cache/ against the working directory: the content root.
        working-directory: apexsim-content
    steps:
      - uses: actions/checkout@v5

      # The code depends on the content, never the reverse: no path from
      # apexsim-content/ into apexsim/ beyond the allowed test-only edge
      # (paths into apexsim-lib/ are fine: the content builds against it).
      - name: The content does not reach into the code
        run: python3 tools/check_direction.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The Bevy editor links the system's audio, input and window libraries.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apexsim-content/track-editor

      - name: Check formatting
        run: cargo fmt --manifest-path track-editor/Cargo.toml --all --check

      # The libraries and binaries; the tests are not held to clippy.
      - name: Clippy
        run: cargo clippy --manifest-path track-editor/Cargo.toml --workspace -- -D warnings

      # Plain `cargo test` skips the #[ignore]d whole-calendar bakes (about
      # 20 minutes); run them by hand with -- --ignored.
      - name: Test
        run: cargo test --manifest-path track-editor/Cargo.toml --workspace

  site:
    name: Marketing page is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apexsim
    steps:
      # The page's pictures are cut from LFS files (the car renders, the
      # liveries, the splash); manifest.json holds the hash of the real
      # bytes, so a checkout of the pointer files can never match it.
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the build's dependencies
        run: pip install pyyaml jinja2 pillow

      # apexsim/docs is generated from apexsim/site and from apexsim-content
      # (car.toml, track YAML, the car renders): a change to any of them
      # without a rebuild leaves the published page behind the game.
      - name: Check docs/ against a fresh build
        run: python scripts/site/build_site.py --check

      - name: Unit tests
        run: python -m unittest discover -s scripts/site/tests

  client:
    name: Client (Unreal project sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apexsim/game-unreal
    steps:
      - uses: actions/checkout@v5

      - name: Validate project metadata
        run: |
          jq -e '
            .FileVersion == 3 and
            .EngineAssociation == "5.8" and
            ([.Modules[] | select(.Name == "ApexSim" and .Type == "Runtime")] | length == 1) and
            ([.Modules[] | select(.Name == "ApexSimNet" and .Type == "Runtime")] | length == 1)
          ' ApexSim.uproject

      - name: Verify target and module definitions
        run: |
          test -f Source/ApexSim.Target.cs
          test -f Source/ApexSimEditor.Target.cs
          test -f Source/ApexSim/ApexSim.Build.cs
          test -f Source/ApexSimNet/ApexSimNet.Build.cs
          test -f Source/ThirdParty/ApexPhysics/ApexPhysics.Build.cs
          grep -q 'class ApexSimTarget' Source/ApexSim.Target.cs
          grep -q 'class ApexSimEditorTarget' Source/ApexSimEditor.Target.cs
