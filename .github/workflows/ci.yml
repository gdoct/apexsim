name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Check formatting
        run: cargo fmt --check

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  client:
    name: Client (Unreal C++)
    runs-on: [self-hosted, Windows, UnrealEngine-5.8]
    defaults:
      run:
        working-directory: game-unreal
    steps:
      - uses: actions/checkout@v4

      - name: Build Unreal Editor target
        shell: pwsh
        run: |
          if (-not $env:UNREAL_ENGINE_ROOT) {
            throw "UNREAL_ENGINE_ROOT must point to the Unreal Engine 5.8 installation."
          }
          & "$env:UNREAL_ENGINE_ROOT\Engine\Build\BatchFiles\Build.bat" ApexSimEditor Win64 Development "-Project=$PWD\ApexSim.uproject" -WaitMutex -NoHotReload
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
